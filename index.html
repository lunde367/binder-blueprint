<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Binder Blueprint</title>
<meta name="description" content="Plan your real trading card binder before you sleeve a single card.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Fredoka:wght@600&family=Bangers&family=Permanent+Marker&family=Playfair+Display:wght@800&family=Press+Start+2P&display=swap">
<meta name="theme-color" content="#EEF2F4">
<script>try{var t=localStorage.getItem('binderBlueprint.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E2E8EC; --fg:#15232B; --muted:#5B6B74; --line:#D3DCE1;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --have:#1E8A4C; --have-bg:#DDF2E5; --need:#C2410C; --need-bg:#FBE6DA;
  --foil:linear-gradient(115deg,#7FD6D9 0%,#C9B6F2 35%,#F6D38A 65%,#8FE0B5 100%);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --binder:#1B2B33; --binder-2:#263a44; --page:#F7F9FA;
  --zoom:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0E1619; --surface:#16222A; --sunk:#0A1114; --fg:#E4ECEF; --muted:#93A4AC; --line:#26353D;
  --accent:#3FC1C9; --accent-ink:#06282B; --have:#5BD08C; --have-bg:#123224; --need:#F59362; --need-bg:#3A1D10;
  --binder:#050A0C; --binder-2:#0d171b; --page:#1B2830; color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0E1619; --surface:#16222A; --sunk:#0A1114; --fg:#E4ECEF; --muted:#93A4AC; --line:#26353D;
  --accent:#3FC1C9; --accent-ink:#06282B; --have:#5BD08C; --have-bg:#123224; --need:#F59362; --need-bg:#3A1D10;
  --binder:#050A0C; --binder-2:#0d171b; --page:#1B2830; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:500 16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:6px 0 0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;line-height:1.15}
h3{font-family:var(--display);font-weight:800;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num,.mono{font-family:var(--mono)}

/* ---------- header ---------- */
header{display:flex;flex-direction:column;gap:6px}
.foil{height:6px;border-radius:3px;background:var(--foil)}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin:0}
.who{font-size:13px;color:var(--muted)}
.bchip{border:0;background:none;color:var(--accent);font:600 13px var(--body);padding:0;text-align:right}
.hrow{display:flex;align-items:center;gap:10px;min-height:36px}
.acct{margin-left:auto;display:inline-flex;align-items:center;gap:7px;min-height:36px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 13px var(--body);padding:6px 12px;border-radius:999px;white-space:nowrap}
.acct.in{border-color:var(--line);color:var(--fg);font-weight:600}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--have)}
.acct.saving .dot,.acct.syncing .dot{background:#E0A030;animation:blink 1s infinite}
.acct.offline .dot{background:var(--muted)}
.acct.error .dot{background:var(--need)}
@keyframes blink{50%{opacity:.3}}
.hrow .acct + .theme{margin-left:0}
.inp.code{font:600 24px var(--mono);letter-spacing:.3em;text-align:center}
.mtag{display:inline-block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:6px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.nudge{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.nudge p{margin:0;flex:1;font-size:14px;color:var(--muted)}
#famBox .brow{flex-wrap:nowrap;padding:6px 8px}
#famBox .brow .inp{flex:1;width:auto;min-width:0}
.vlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.vrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.vrow span{flex:1}
.theme{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:6px 12px;border-radius:999px}
.theme svg{width:16px;height:16px}
.theme{padding:3px;gap:2px}
.theme span{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.theme span.on{background:var(--accent);color:var(--accent-ink)}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.btn svg.i,.fab svg.i{margin-right:2px}
.seg.addtabs .ic svg.i{width:24px;height:24px}
.ticon svg.i{width:20px;height:20px}
.qsave svg.i{width:16px;height:16px;vertical-align:0}
.warn svg.i{margin-right:4px}
.back{border:0;background:transparent;color:var(--accent);font:700 15px var(--body);padding:8px 8px 8px 0;min-height:40px;align-self:flex-start}
.home{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hero .btn{font-size:18px;padding:16px 28px;min-height:56px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:520px}
.steps div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--sunk);color:var(--fg);display:grid;place-items:center;font:800 14px var(--body)}
.btile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;text-align:left;width:100%}
.btile b{font-size:17px;display:block}
.btile .meter{grid-column:1/-1;margin:0}
.btile .go{color:var(--accent);font-weight:800;font-size:20px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:600 15px var(--body);padding:10px 6px;border-radius:9px;white-space:nowrap}
.tabs a.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:560px){
  .tabs{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:0 0 auto;font-size:14px;padding:9px 12px;scroll-snap-align:start}
}
main{display:flex;flex-direction:column;gap:14px}
.banner:empty{display:none}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--fg)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:transparent;color:var(--fg);font:700 15px var(--body);padding:11px 14px;border-radius:10px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.btn.danger{color:var(--need)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--fg);width:36px;height:36px;border-radius:9px;font:700 15px var(--body);display:inline-grid;place-items:center;flex:none;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 20px;font:700 16px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-radius:9px;min-height:36px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- stats / toolbars ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--foil)}
.meter.over i{background:var(--need)}
.warn{background:var(--need-bg);border:1px solid var(--need);color:var(--need);border-radius:12px;padding:10px 14px;font-weight:700}
.warn span{font-weight:500}

/* ---------- binder view ---------- */
.spreads{display:flex;flex-direction:column;gap:18px;align-items:center}
.spreads.stacked .spread{flex-direction:column;gap:20px;padding-bottom:22px}
.spreads.stacked .page.cover{display:none}
.zoomer{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);overflow:hidden}
.zoomer{padding:0;border-radius:50%}
.zoomer button{width:56px;height:56px;border:0;border-radius:50%;background:transparent;color:var(--fg);display:grid;place-items:center;padding:0}
.zoomer button svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.spread-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.spread-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.spread{display:flex;gap:6px;background:linear-gradient(90deg,var(--binder),var(--binder-2) 50%,var(--binder));padding:12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.spread.single{background:var(--binder)}
.page{width:var(--pw,170px);background:var(--page);border-radius:7px;padding:6px;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;align-content:start;position:relative}
.page.cover{background:transparent;display:grid;place-items:center;color:#7d929c;font-size:12px;text-transform:uppercase;letter-spacing:.08em;text-align:center;border:1.5px dashed rgba(255,255,255,.14)}
@media(max-width:700px){.page.cover{width:calc(var(--pw,170px) * .22);writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;padding:4px 0}}
.page.over{background:var(--need-bg)}
.page .pno{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:500 10px var(--mono);color:#7d929c;transform:translateY(100%);padding-top:2px}
.page.over .pno{color:var(--need)}
.pk{aspect-ratio:63/88;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden;border:none;padding:0;display:block;width:100%}
.pk.blank{background:var(--sunk);opacity:.7}
.pk.empty{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 6px,transparent 6px,transparent 12px);box-shadow:inset 0 0 0 1.5px var(--line)}
.pk .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;text-align:center;padding:4px;background:var(--sunk);color:var(--muted);font:600 calc(9px*var(--zoom)) var(--body);line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.pk .ph span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.pk .ph.under{display:none}
.pk.broken .ph.under{display:flex}
.pk .ph b{font:500 calc(11px*var(--zoom)) var(--mono);color:var(--fg)}
.pk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pk.need img,.pk.need .ph{filter:grayscale(.85);opacity:.62}
.pk.need{box-shadow:inset 0 0 0 1.5px var(--line)}
.pk .tag{position:absolute;left:3px;bottom:3px;font:500 9px var(--mono);background:var(--surface);color:var(--muted);border-radius:4px;padding:0 4px;line-height:1.6;opacity:.95}
.pk.need:has(.ph:not(.under)) .tag{display:none}
.pk.own .tag{left:auto;right:3px;top:3px;bottom:auto;width:16px;height:16px;padding:0;border-radius:50%;background:var(--have);color:#fff;display:grid;place-items:center;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pk.sel{outline:3px solid var(--accent);outline-offset:-3px}
.pk.title,.titlepage{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:var(--display);font-weight:800;padding:4px;line-height:1.1;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pk.title{font-size:calc(11px*var(--zoom))}
.titlepage{grid-column:1/-1;border-radius:5px;font-size:calc(26px*var(--zoom));border:none;width:100%;padding:12%;box-shadow:inset 0 0 0 calc(6px*var(--zoom)) rgba(255,255,255,.25)}
.titlepage span{display:block;max-width:100%;position:relative}
.titlepage{position:relative}
.tp-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);gap:3px;padding:0;pointer-events:none}
.tp-grid i{border:1px dashed rgba(255,255,255,.45);border-radius:3px}
.pk.energy{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(10px*var(--zoom));gap:3px}
.pk.energy .orb{width:46%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.8)}
.pk.over-pk::after{content:"";position:absolute;inset:0;background:rgba(194,65,12,.18)}
.more-pages{text-align:center}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty-state h2{color:var(--fg);margin-bottom:6px}

/* ---------- contents ---------- */
.intro{margin:0;color:var(--muted)}
.secs{display:flex;flex-direction:column;gap:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.sec .sw{width:8px;align-self:stretch;border-radius:4px;flex:none}
.sec .info{flex:1;min-width:0}
.sec .info b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ins{align-self:flex-start;border:0;background:none;color:var(--accent);font:700 14px var(--body);padding:2px 4px}

/* ---------- panels / forms ---------- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span:first-child,.where label,label.lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;min-height:42px}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickopt{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:112px;font:700 14px var(--body);color:var(--fg)}
.pickopt.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.mini{display:grid;gap:2px;background:var(--binder);padding:4px;border-radius:5px}
.mini i{display:block;width:12px;height:17px;background:#e9eef1;border-radius:1.5px}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper input{width:80px;text-align:center}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.brow.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.brow .grow{flex:1;min-width:140px}
.brow b{font-size:16px}
.openlbl{font-weight:700;font-size:13px;color:var(--accent)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,12,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.modal{background:var(--bg);width:100%;max-width:520px;max-height:92vh;max-height:calc(100dvh - 24px);overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.wide{max-width:760px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h2{flex:1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 4px}
.addtabs{margin-bottom:14px}
.seg.addtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:none;padding:0;border-radius:0}
.seg.addtabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:8px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:700 13px var(--body);line-height:1.15;text-align:center}
.seg.addtabs button .ic{font-size:20px;line-height:1}
.seg.addtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.seg.addtabs button:not(.on):hover{border-color:var(--accent)}
/* the add dialog keeps one height, so the tabs never move when you switch */
.modal.addm{height:calc(100dvh - 24px);max-height:none}
@media(min-width:700px){.modal.addm{height:min(860px,calc(100dvh - 48px))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.setlist{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.setlist button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600}
.setlist button span{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.setlist button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.where{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.where{grid-template-columns:1fr}}
.where label{display:flex;flex-direction:column;gap:4px}
.where select{text-transform:none;letter-spacing:0}
.preview{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px;background:var(--have-bg);border:1px solid var(--have);color:var(--fg)}
.preview.idle{background:var(--sunk);border-color:var(--line);color:var(--muted)}
.preview.bad{background:var(--need-bg);border-color:var(--need)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:300px;overflow:auto}
.results{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px 8px;max-height:min(46vh,380px)}
.res{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--fg);min-width:0}
.res .pk{--zoom:.9}
.res.sel .pk{outline:3px solid var(--accent);outline-offset:-3px}
.res .cap{font-size:11px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.res .cap b{display:block;color:var(--fg);font-size:12px}
.results .pk .chk{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:900;display:none;place-items:center;z-index:2}
.results .res.sel .chk{display:grid}
.results .pk.own .tag{display:none}
.erow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .dot{width:30px;height:42px;border-radius:4px;overflow:hidden;flex:none}
.erow .dot img{width:100%;height:100%;object-fit:cover;display:block}
.erow b{flex:1}
.erow .qty{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 3px var(--fg)}
.detail{display:flex;gap:16px;align-items:flex-start}
.detail .dimg{width:150px;flex:none}
.detail .dimg .pk{--zoom:1.4;border-radius:7px}
.detail .grow{flex:1;min-width:0}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hn{display:flex;width:100%}
.hn button{flex:1;min-height:44px;font-size:15px}
.hn button.on.have{background:var(--have-bg);color:var(--have)}
.hn button.on.need{background:var(--need-bg);color:var(--need)}
.havebtn{width:100%}
.havebtn.on{background:var(--have-bg);color:var(--have);border-color:var(--have)}
.havebtn.off{background:var(--need-bg);color:var(--need);border-color:var(--need)}
.toast{pointer-events:none}
.toast button{pointer-events:auto;margin-left:12px;border:0;background:transparent;color:var(--accent);font:800 15px var(--body);padding:4px 6px;text-decoration:underline}
#ins-print{display:none}
.hint{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* drag */
.page .pk{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pk img{pointer-events:none;-webkit-user-drag:none}
.pk.pressing{transform:scale(.94);transition:transform .25s ease}
.pk.lifted{opacity:.2}
.pk.ghost{position:fixed;z-index:80;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.45);border-radius:6px;opacity:.95}
.pk.drop-target{outline:3px solid var(--accent);outline-offset:-1px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
body.dragging,body.dragging *{cursor:grabbing!important}
#trash{position:fixed;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:70;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--need-bg);color:var(--need);border-top:2px dashed var(--need);font:700 16px var(--body);transform:translateY(110%);transition:transform .18s ease,background .12s}
#trash svg{width:26px;height:26px}
body.dragging #trash{transform:none}
#trash.hot{background:var(--need);color:#fff;border-top-style:solid}
#trash.hot svg{transform:scale(1.2)}
body.dragging .fab,body.dragging .zoomer{visibility:hidden}
.pk.just-dropped{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.15)}100%{transform:scale(1)}}
/* inserts */
.btile.tool{grid-template-columns:auto 1fr auto}
.ticon{width:36px;height:50px;border-radius:5px;background:var(--foil);display:grid;place-items:center;font-size:18px;color:#1b2a30}
.ins-top{display:flex;gap:8px;flex-wrap:wrap}
.ins-more{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ins-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;max-width:520px;width:100%;align-self:center}
.ins-slot{aspect-ratio:5/7;border:1px dashed #b8c2c9;border-radius:4px;background:#f3f5f6;padding:0;overflow:hidden;display:grid;place-items:center;color:#8a97a0;font-size:28px}
.ins-slot:not(.empty){border-style:solid;border-color:#d0d7dc}
.ins-slot canvas{width:100%;height:100%;display:block}
.ins-mode{display:flex;flex-direction:column;gap:8px;align-items:center}
.ins-whole{position:relative;align-self:center;width:min(100%,var(--ww,420px));aspect-ratio:var(--ar);border:0;padding:0;background:#f3f5f6;border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;place-items:center;color:#8a97a0;font-size:15px;font-weight:600}
.ins-whole.empty{border:1.5px dashed #b8c2c9;box-shadow:none}
.ins-whole canvas{position:absolute;inset:0;width:100%;height:100%}
.ins-whole .cuts{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);pointer-events:none}
.ins-whole .cuts i{border:0.5px dashed rgba(255,255,255,.75);outline:0.5px dashed rgba(0,0,0,.35);outline-offset:-1px;font:600 11px var(--mono);color:#fff;text-shadow:0 1px 2px #000;padding:3px 5px;font-style:normal}
.ins-edit{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:16px;align-items:start}
.ins-slot{position:relative}
.qsave{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;display:grid;place-items:center;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.qsave.done{background:#F2C230;color:#15232B}
.dpick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.dpick button{flex:none;width:72px;border:2px solid transparent;border-radius:7px;padding:2px;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg);font:600 10px var(--body)}
.dpick button.on{border-color:var(--accent)}
.dpick canvas,.dpick .none{width:54px;height:76px;border-radius:4px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.dpick img.sthumb{width:54px;height:76px;border-radius:4px;display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);object-fit:cover}
.dpick .none{display:grid;place-items:center;background:var(--sunk);font-size:20px;color:var(--muted);box-shadow:none;border:1px dashed var(--line)}
.dpick span{max-width:70px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center;line-height:1.2;min-height:2.4em;word-break:break-word}
.pk.title.has-design{padding:0;background-size:cover!important;background-position:center!important;color:transparent;text-shadow:none}
.titlepage.has-design{background-size:cover!important;background-position:center!important}
.titlepage.has-design > span{display:none}
.titlepage.has-design{background:none!important;padding:0;box-shadow:none}
.tp-split{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);gap:3px;pointer-events:none}
.tp-split i{border-radius:3px;background-repeat:no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.gc .tp-split{gap:2px}
.saved{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px;align-self:center}
.saved h3{margin:0;font:700 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.saved h3 .pro{font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:999px;background:linear-gradient(135deg,#FF6B6B,#FFD36B,#8CF5A8,#6BD8FF,#B48CFF);color:#15232B}
.saved-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.sv{flex:none;width:84px;display:flex;flex-direction:column;gap:4px;align-items:center;scroll-snap-align:start;position:relative}
.sv button.use{border:0;padding:0;background:none;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25);width:84px;aspect-ratio:5/7;display:block}
.sv button.use img{width:100%;height:100%;display:block;object-fit:cover}
.sv .nm{font:600 11px var(--body);text-align:center;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv .badge{position:absolute;top:4px;left:4px;font:700 9px var(--body);text-transform:uppercase;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.7);color:#fff;pointer-events:none}
.sv .more{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;padding:0}
.saved .hint{font-size:12px;color:var(--muted);margin:0}
.ie-btns{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:6px;color:var(--muted);font:600 13px var(--body);text-decoration:underline;cursor:pointer}
.opt{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;opacity:.7;margin-left:4px}

@media(max-width:600px){.ins-edit{grid-template-columns:1fr}.ins-edit .ins-canvas-wrap{position:sticky;top:-16px;z-index:3;background:var(--bg);padding:8px 0 10px;margin:-8px 0 0;flex-direction:row;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}.ie-tools #ieHint{font-size:12px}.ins-edit .ins-canvas-wrap canvas{width:min(38vw,150px);flex:none}}
.ins-canvas-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ie-tools{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;width:100%}
.ie-tools .btn{width:100%;justify-content:center}
.ie-tools p{margin:0}
.ie-row{display:flex;gap:6px}
.ie-row .btn{flex:1;padding:6px 8px}
.ie-zoom{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ins-canvas-wrap canvas{width:min(100%,240px);aspect-ratio:5/7;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);touch-action:none;cursor:grab;background:var(--sunk)}
.ins-controls{display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:6px 10px;border-radius:999px;min-height:34px}
.decochips button{width:44px;height:40px;padding:0;justify-content:center}
.decochips button:first-child{width:auto;padding:6px 12px}
.decochips svg{width:20px;height:20px;fill:currentColor}
.fontchips button{font-size:16px;padding:6px 14px}
.fontchips button[data-f=pixel]{font-size:10px}
.chips button i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));box-shadow:0 6px 20px rgba(0,0,0,.25);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

/* ---------- sleeving guide ---------- */
.glegend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:18px;border-radius:3px}
.lg.tick{border:1.5px solid var(--fg);background:#fff}
.lg.skip{border:1.5px dashed var(--muted)}
.gspreads{display:flex;flex-direction:column;gap:14px}
.gspread{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;break-inside:avoid;page-break-inside:avoid}
.gspread h3{font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.gspread h3 small{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gpair{display:flex;gap:14px}
.gpg{flex:1;min-width:0}
.gpg.over .ggrid{outline:2px solid var(--need);outline-offset:2px;border-radius:4px}
.gcover{display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.gpg .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px}
.gpg .lbl span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px}
.gc{aspect-ratio:63/88;border:1px solid #b9c2c9;border-radius:5px;position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.gc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gc .cap{position:relative;background:rgba(255,255,255,.93);color:#15232B;font:600 8.5px/1.15 var(--body);padding:2px 3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gc .cap .n{font:500 8px var(--mono)}
.gc .cap.light{background:transparent;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);text-align:center;font-size:10px}
.gc .cap.light.big{font:800 16px/1.2 var(--display);-webkit-line-clamp:4}
.gc .cap.light.big small{font:600 10px var(--body);opacity:.85}
.gc .tick{position:absolute;top:3px;left:3px;width:14px;height:14px;border:1.5px solid #222;border-radius:3px;background:#fff;z-index:1}
.gc.nopic{justify-content:center}
.gc.nopic .cap{background:transparent;text-align:center;font-size:9.5px;-webkit-line-clamp:4}
.gc.skip{border:1.5px dashed #8f99a1;background:repeating-linear-gradient(45deg,#fff,#fff 5px,#f1f3f5 5px,#f1f3f5 10px)}
.gc.skip img{filter:grayscale(1);opacity:.4}
.gc.skip .cap{background:transparent;color:#5f6b74}
.gc.unused{border:1px solid #eceff1;background:transparent}
.gsec-h{margin:8px 0 0;color:var(--need)}
.printhead{display:none}

@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr;gap:6px}
  .stats .stat:first-child{grid-column:1/-1}
  .stat b{font-size:22px}
  .sec{flex-wrap:wrap}
  .sec .acts{width:100%;justify-content:flex-start;padding-left:20px}
  .detail .dimg{width:110px}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f2f2f2;--fg:#000;--muted:#444;--line:#bbb;--need:#9a3412}
  body{background:#fff;color:#000;font-size:11px}
  .wrap{padding:0;max-width:none;gap:0}
  header,.tabs,.banner,.fab,.zoomer,#trash,.no-print,.toast,#modal-root{display:none!important}
  body.print-ins .wrap{display:none!important}
  body.print-ins #ins-print{display:block}
  .ins-page{position:relative;width:8.5in;height:11in;overflow:hidden;page-break-after:avoid;break-after:avoid}
  .ins-grid{position:absolute;left:0.5in;top:0.25in;width:7.5in;height:10.5in;display:grid;grid-template-columns:repeat(3,2.5in);grid-template-rows:repeat(3,3.5in)}
  .ins-grid img{width:2.5in;height:3.5in;display:block;outline:0.5px dashed #9aa3ab;outline-offset:-0.25px}
  .tick{position:absolute;background:#000}
  .tick.v{width:0.5px;height:0.2in}
  .tick.h{height:0.5px;width:0.4in}
  .printhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .printhead h1{font-size:20px;margin:0}
  .printhead div{font-size:11px;color:#333;text-align:right}
  .glegend{color:#333;font-size:10px;margin-bottom:6px}
  .gspreads{display:block}
  .gspread{border:1px solid #999;border-radius:8px;margin-bottom:0.12in;padding:6px 8px}
  .gspread h3{font-size:13px;margin-bottom:4px}
  .gpair{gap:0.2in;justify-content:center}
  .gpg{flex:0 0 2.8in}
  .gpg.gcover{visibility:hidden}
  .printhead{margin-bottom:4px}
  .glegend{margin-bottom:4px}
  .gc .cap{font-size:7.5px}
  .gc .cap .n{font-size:7px}
  .gc{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="foil"></div>
    <div class="hrow"><button class="back" id="back" hidden>‹ My binders</button><button class="acct" id="acct"></button><button class="theme" id="theme" aria-label="Switch light or dark mode"></button></div>
    <h1 id="title">Binder Blueprint</h1>
    <p class="sub" id="sub">Plan your real binder before you sleeve a single card.</p>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#binder" data-tab="binder">Binder</a>
    <a href="#contents" data-tab="contents">Contents</a>
    <a href="#guide" data-tab="guide">Print</a>
    <a href="#setup" data-tab="setup">Setup</a>
  </nav>
  <div class="banner" id="banner"></div>

</div>
<button class="fab" id="fab"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add</button>
<div id="trash" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg><span>Drop here to remove</span></div>
<div id="modal-root"></div>
<div id="ins-print"></div>
<style id="pagestyle"></style>

<script>
/* =========================================================
   Binder Blueprint — Phase 1
   One binder = one ordered list of items. Pages are calculated.
   ========================================================= */
const API = 'https://api.tcgdex.net/v2/en';
const LS_KEY = 'binderBlueprint.v1';
const GRID = {4:[2,2], 9:[3,3], 12:[3,4]};          // pockets -> [cols, rows]
const TITLE_COLORS = ['#F2B705','#3A86FF','#E63946','#2A9D8F','#8E5CF7','#FF7AB6','#FF8C42','#2B2D42','#8D99AE'];
const ENERGY = [['Grass','#4FAF5A'],['Fire','#EE5A2F'],['Water','#2F8FD8'],['Lightning','#E9B90C'],['Psychic','#9B4FB5'],['Fighting','#B5652F'],['Darkness','#3B3F4A'],['Metal','#8A95A3'],['Fairy','#E58BBE']];
const ENERGY_COLOR = Object.fromEntries(ENERGY);
// Standard basic energy card art (Crown Zenith; Fairy from Sun & Moon, its last printing)
const ENERGY_IMG = Object.fromEntries(Object.entries({ Grass: 'swsh/swsh12.5/152', Fire: 'swsh/swsh12.5/153', Water: 'swsh/swsh12.5/154', Lightning: 'swsh/swsh12.5/155', Psychic: 'swsh/swsh12.5/156', Fighting: 'swsh/swsh12.5/157', Darkness: 'swsh/swsh12.5/158', Metal: 'swsh/swsh12.5/159', Fairy: 'sm/sm1/172' }).map(([t, p]) => [t, `https://assets.tcgdex.net/en/${p}/low.webp`]));

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
// true inside the Android / iPhone app (Capacitor), false on the website
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const APP_LINK = 'binderblueprint://auth';   // the email sign-in link opens the app here
try { if (sessionStorage.getItem('binderBlueprint.deleted')) { sessionStorage.removeItem('binderBlueprint.deleted'); setTimeout(() => toast('Your account and everything in it were deleted.'), 400); } } catch (e) {}
if (NATIVE) {

/* ---------------- layout engine ----------------
   Walks the item list once and gives every item a pocket position.
   side index s: 0 = first page (a right-hand page when the binder opens in spreads),
   odd sides are left pages, even sides are right pages. */
function layout(b, items = b.items) {
  const P = b.pockets;
  let pos = 0;
  const at = new Array(items.length).fill(-1);
  const fullSides = {};
  const fresh = to => {
    if (pos % P) pos = Math.ceil(pos / P) * P;
    if (to === 'spread' && b.spreads && (pos / P) % 2 === 0) pos += P;   // jump to next left page
  };
  items.forEach((it, i) => {
    if (it.k === 'break') { fresh(it.to); return; }
    if (it.k === 'title' && it.size === 'page') { fresh('page'); at[i] = pos; fullSides[pos / P] = i; pos += P; return; }
    at[i] = pos++;
  });
  const cap = b.pages * 2 * P;
  return { at, used: pos, cap, P, fullSides, usedSides: Math.ceil(pos / P), capSides: b.pages * 2 };
}
function bySide(L) {
  const m = {};
  L.at.forEach((p, i) => { if (p < 0) return; const s = Math.floor(p / L.P); (m[s] ??= {})[p % L.P] = i; });
  return m;
}
function sideWords(b, s) {
  const sheet = Math.floor(s / 2) + 1, face = s % 2 ? 'back' : 'front';
  const lr = b.spreads ? (s % 2 ? 'left page' : 'right page') : '';
  return { label: `Page ${s + 1}`, lr, sheet: `binder page ${sheet}, ${face}` };
}
/* How would the binder look with these extra items? */
function fitAdvice(b, L) {
  if (L.used <= L.cap) return null;
  const needSides = L.usedSides, extraSheets = Math.ceil((needSides - L.capSides) / 2);
  const bigger = [9, 12].filter(p => p > b.pockets).find(p => layout({ ...b, pockets: p }).used <= b.pages * 2 * p);
  return { needSides, extraSheets, bigger };
}
function adviceText(b, a) {
  let t = `Add ${plural(a.extraSheets, 'more binder page')} (you have ${b.pages})`;
  if (a.bigger) t += `, or switch to a ${a.bigger}-pocket binder`;
  return t + '.';
}

/* ---------------- sections ---------------- */
function sectionOrder(b) {
  const seen = new Set(), out = [];
  b.items.forEach(it => { if (!seen.has(it.sec)) { seen.add(it.sec); out.push(it.sec); } });
  return out;
}
function secStats(b, L, sec) {
  let cards = 0, own = 0, pockets = 0, first = Infinity, last = -1, color = null;
  b.items.forEach((it, i) => {
    if (it.sec !== sec) return;
    if (it.k === 'card') { cards++; if (it.own) own++; }
    if (it.k === 'title' && !color) color = it.color;
    const p = L.at[i]; if (p < 0) return;
    pockets += (it.k === 'title' && it.size === 'page') ? L.P : 1;
    first = Math.min(first, p); last = Math.max(last, p + ((it.k === 'title' && it.size === 'page') ? L.P - 1 : 0));
  });
  return { cards, own, pockets, firstSide: first === Infinity ? null : Math.floor(first / L.P), lastSide: last < 0 ? null : Math.floor(last / L.P), color, over: last >= L.cap };
}

async function getJSON(url) {

const DEMO_SETS = [

function demoCards(set) {
  return Array.from({ length: set.total }, (_, i) => {

    return { cid: `${set.id}-${n}`, num: n, name: `${DEMO_WORDS[i % DEMO_WORDS.length]} ${set.name.split('· ')[1].split(' ')[0]}`, img: null, set: set.id, setName: set.name };

async function getSets() {

    setsCache = raw.filter(s => s.cardCount && s.cardCount.total > 0 && !/^(A|B)\d+[a-z]?$|^P-[A-Z]$/.test(s.id))

    .filter(x => x.setId in rank)
    .sort((a, b) => rank[a.setId] - rank[b.setId])

function refreshPreview() {

  const r = pendingItems();
  if (!r) { box.className = 'preview idle'; box.textContent = 'Pick something to add.'; go.disabled = true; return; }
  const b = cur(), idx = insertIndex(b, $('#aPos').value);
  const items = [...b.items.slice(0, idx), ...r.items.map(x => ({ ...x, _new: 1 })), ...b.items.slice(idx)];

    const a = fitAdvice(b, L);

    box.innerHTML = `${ic('warn')} <b>${esc(r.label)} won't all fit.</b> It needs ${plural(ls - fs + 1, 'page side')} (${where}) and you have ${plural(sidesLeft, 'side')} left. ${adviceText(b, a)} You can still add it and fix it later.`;
  } else {
    box.className = 'preview';

/* ---------------- drag to rearrange ----------------
   Touch: hold a card still for a moment, then drag. Moving early is a normal scroll.
   Mouse: press and drag a few pixels. Drop on any pocket to put the card there. */
const DRAG = { trash: false, el: null, i: -1, id: null, type: '', x0: 0, y0: 0, x: 0, y: 0, timer: 0, active: false, ghost: null, target: null, raf: 0, justDropped: false };
const HOLD_MS = 260;

  document.body.classList.remove('dragging');

}
function dragLift() {

  g.className = el.className + ' ghost'; g.removeAttribute('data-i');
  Object.assign(g.style, { width: r.width + 'px', height: r.height + 'px', left: '0px', top: '0px' });
  DRAG.dx = DRAG.x - r.left; DRAG.dy = DRAG.y - r.top;
  document.body.appendChild(g); DRAG.ghost = g;
  el.classList.add('lifted');
  document.body.classList.add('dragging');

}
function dragMoveGhost() {
  if (!DRAG.ghost) return;
  DRAG.ghost.style.transform = `translate(${DRAG.x - DRAG.dx}px, ${DRAG.y - DRAG.dy}px) rotate(-3deg) scale(1.08)`;
  const under = document.elementFromPoint(DRAG.x, DRAG.y);
  const overTrash = !!(under && under.closest('#trash'));
  if (overTrash !== DRAG.trash) { DRAG.trash = overTrash; $('#trash').classList.toggle('hot', overTrash); if (overTrash) try { navigator.vibrate?.(8); } catch (e) {} }
  const t = overTrash ? null : under && under.closest('.page .pk');
  if (t !== DRAG.target) {
    DRAG.target?.classList.remove('drop-target');
    DRAG.target = t && t !== DRAG.el ? t : null;
    DRAG.target?.classList.add('drop-target');
  }
}
function dragLoop() {   // scroll the page when the finger is near the top or bottom edge
  if (!DRAG.active) return;
  const edge = 80, bottom = innerHeight - $('#trash').offsetHeight;
  let v = 0;
  if (DRAG.y < edge) v = -Math.ceil((edge - DRAG.y) / 6);
  else if (DRAG.y > bottom - edge && DRAG.y < bottom) v = Math.ceil((DRAG.y - (bottom - edge)) / 6);
  if (v) { window.scrollBy(0, v); dragMoveGhost(); }

}
/* Where does the dragged item land? Returns the index to insert at (after removing it). */

  // A blank pocket: put it right after the last item placed before that pocket.

/* Is this part of the binder a set in number order? (whole sets and card ranges) */

async function addPictures(files) {
  if (ins.mode === 'page') {
    const f = [...files].find(f => /^image\//.test(f.type)); if (!f) return toast('That file isn’t a picture.');
    try { await setSlotPicture(ins.page, f); } catch (e) { return toast('That picture could not be read.'); }
    render(); return toast('Picture added. Tap the page to crop it.');
  }
  const list = [...files].filter(f => /^image\//.test(f.type));
  if (!list.length) return toast('Those files aren’t pictures.');
  const free = ins.slots.filter(slotEmpty);   // only completely empty cards
  if (!free.length) return toast('All 9 cards are in use. Clear one first.');
  const use = list.slice(0, free.length);
  toast(`Adding ${plural(use.length, 'picture')}…`);
  for (let k = 0; k < use.length; k++) {
    try { await setSlotPicture(free[k], use[k]); } catch (e) { toast('One picture could not be read.'); }
  }
  render();
  toast(list.length > use.length ? `Added ${use.length}. Only 9 fit on a sheet.` : `Added ${plural(use.length, 'picture')}. Tap one to crop it.`);
}

  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    const r = cv.getBoundingClientRect();
    if (pts.size === 1) { slot.x += (e.clientX - prev[0]) / r.width; slot.y += (e.clientY - prev[1]) / r.height; }
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (last) slot.z *= d / last; last = d;
    }
    clamp(); paint();
  });
  const up = e => { pts.delete(e.pointerId); last = null; saveIns(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); slot.z *= e.deltaY < 0 ? 1.06 : 1 / 1.06; clamp(); changed(); }, { passive: false });
}

/* ---------- printing: 3 × 3 at exact size with cut lines ---------- */
async function wholePagePieces(sl) {   // the big design, cut into card-sized pieces in reading order
  const [c, r] = pageGrid(sl), big = document.createElement('canvas');
  big.width = CARD_W * c; big.height = CARD_H * r;
  await fontReady(sl);
  drawInsert(big.getContext('2d'), sl, big.width, big.height, await slotImage(sl));
  const out = [];
  for (let j = 0; j < r; j++) for (let i = 0; i < c; i++) {
    const p = document.createElement('canvas'); p.width = CARD_W; p.height = CARD_H;
    p.getContext('2d').drawImage(big, i * CARD_W, j * CARD_H, CARD_W, CARD_H, 0, 0, CARD_W, CARD_H);
    out.push({ url: p.toDataURL('image/jpeg', 0.92), cell: (j % 3) * 3 + i, sheet: Math.floor(j / 3) });   // same spot as in the binder
  }
  return out;
}
async function printInserts() {
  if (framed) return toast('Printing works on your own site. This preview can’t open the print window.');
  let sheets;
  if (ins.mode === 'page') {
    if (!ins.page || slotEmpty(ins.page)) return;
    sheets = [];
    for (const pc of await wholePagePieces(ins.page)) { (sheets[pc.sheet] ??= Array(9).fill(null))[pc.cell] = pc.url; }
  } else {
    const filled = ins.slots.filter(s => !slotEmpty(s));
    if (!filled.length) return;
    const urls = [];
    for (const s of filled) {
      const c = document.createElement('canvas'); c.width = CARD_W; c.height = CARD_H;
      await fontReady(s);
      drawInsert(c.getContext('2d'), s, CARD_W, CARD_H, await slotImage(s));
      urls.push(c.toDataURL('image/jpeg', 0.92));
    }
    sheets = [urls];
  }
  const ticks = [];
  for (const x of [0, 2.5, 5, 7.5]) ticks.push(`<i class="tick v" style="left:${0.5 + x}in;top:0"></i><i class="tick v" style="left:${0.5 + x}in;bottom:0"></i>`);
  for (const y of [0, 3.5, 7, 10.5]) ticks.push(`<i class="tick h" style="top:${0.25 + y}in;left:0"></i><i class="tick h" style="top:${0.25 + y}in;right:0"></i>`);
  $('#ins-print').innerHTML = sheets.map((urls, n) => `<div class="ins-page" style="${n < sheets.length - 1 ? 'break-after:page;page-break-after:always' : ''}"><div class="ins-grid">${urls.map(u => u ? `<img src="${u}" alt="">` : '<i></i>').join('')}</div>${ticks.join('')}</div>`).join('');
  await Promise.all($$('#ins-print img').map(im => im.decode?.().catch(() => {})));
  printWith('inserts');
}
async function printWith(kind) {
  $('#pagestyle').textContent = kind === 'inserts' ? '@page{size:letter;margin:0}' : '@page{size:letter;margin:0.4in}';
  document.body.classList.toggle('print-ins', kind === 'inserts');
  if (NATIVE) {   // the app's own print screen; keep the print layout until the job is done
    try { await window.Capacitor.Plugins.Printer.print({ name: kind === 'inserts' ? 'Binder Blueprint inserts' : 'Binder Blueprint sleeving guide' }); }
    catch (err) { toast('Printing isn\'t available on this phone.'); }
    document.body.classList.remove('print-ins'); return;
  }
  try { window.print(); } catch (err) { toast('Your browser blocked printing.'); }
}
window.addEventListener('afterprint', () => document.body.classList.remove('print-ins'));

/* send a binder title card to the maker */
/* Switching views carries the design across when the other side is still empty */
const DESIGN_KEYS = ['text', 'sub', 'textPos', 'bg', 'border', 'font', 'tsize', 'pattern', 'deco', 'decoPlace', 'tstyle', 'hasImg', 'x', 'y', 'z', 'rot'];
async function copyDesign(from, to) {
  DESIGN_KEYS.forEach(k => { if (k in from) to[k] = from[k]; else delete to[k]; });
  to.pid = from.pid || from.id;   // same pattern layout as the original
  if (from.hasImg) {
    const data = await imgDB.get(from.id);
    if (data) { await imgDB.set(to.id, data); delete imgEls[to.id]; Sync.pictureChanged(to.id); } else to.hasImg = false;
  }
}
async function switchInsMode(mode) {
  let note = '';
  if (mode === 'page') {
    ins.page ??= pageSlot();
    const src = ins.slots.find(s => !slotEmpty(s));
    if (src && slotEmpty(ins.page)) { await copyDesign(src, ins.page); note = 'Started the page from your card. Tap it to change anything.'; }
  } else if (ins.page && !slotEmpty(ins.page) && ins.slots.every(slotEmpty)) {
    await copyDesign(ins.page, ins.slots[0]); note = 'Put your page design on card 1.';
  }
  ins.mode = mode; saveIns(); render();
  if (note) toast(note);
}
function titleToInsert(it) {
  if (it.design) {   // put the chosen design on the print sheet (or page)
    if (it.size === 'page') {
      const go_ = async () => { ins.page ??= pageSlot(); const grid = GRID[cur()?.pockets] ? cur().pockets : 9; if (ins.page.hasImg) { Sync.pictureChanged(ins.page.id, true); await imgDB.del(ins.page.id); } await copyDesign(it.design, ins.page); ins.page.grid = grid; ins.mode = 'page'; saveIns(); closeModal(); go('inserts'); toast('Your design is ready to print as a whole page.'); };
      return ins.page && !slotEmpty(ins.page) && designSig(ins.page) !== designSig(it.design) ? confirmBox('Replace your page design?', 'Put this title\'s design on the page in place of your current one?', 'Replace', go_) : go_();
    }
    const sl = ins.slots.find(slotEmpty); if (!sl) return toast('The insert sheet is full. Clear a card first.');
    return copyDesign(it.design, sl).then(() => { ins.mode = 'cards'; saveIns(); closeModal(); go('inserts'); toast(`Put it on card ${ins.slots.indexOf(sl) + 1}, ready to print.`); });
  }
  if (it.size === 'page') {
    const go_ = () => { const id = ins.page?.id; ins.page = { ...pageSlot(GRID[cur()?.pockets] ? cur().pockets : 9), ...(id ? { id } : {}), text: it.text || 'Title', bg: it.color || '#1B2B33' }; ins.mode = 'page'; saveIns(); closeModal(); go('inserts'); toast('Made a whole-page design. Tap it to style it.'); };

  }
  let slot = ins.slots.find(s => slotEmpty(s));
  if (!slot) return toast('The insert sheet is full. Clear a card first.');
  Object.assign(slot, { text: it.text || 'Title', bg: it.color || '#1B2B33', textPos: 'middle' });

/* ---------------- accounts & sync (Supabase) ----------------
   Local first: everything saves on this device instantly, then uploads in the background.
   Each binder is one row (owner, id) with a version number. If another device changed it
   since we last synced, the two are merged: have/need marks are merged card by card, and
   for the order and settings the most recent edit wins (the server keeps a restore point). */
const SB_URL = 'https://nlcamypmyvqomoumbekq.supabase.co';
const SB_KEY = 'sb_publishable_L7MZxuzmCKkDd3ZK8dVCFQ_j_hidAU_';
const SYNC_KEY = 'binderBlueprint.sync';
const PIC_BUCKET = 'insert-images';

const hashStr = str => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36); };
const binderData = b => ({ name: b.name, pockets: b.pockets, pages: b.pages, spreads: b.spreads, member: b.member || null, items: b.items, sections: b.sections, created: b.created });
const structSig = d => hashStr(JSON.stringify([d.items.map(({ own, ...r }) => r), d.sections]));
const settingsSig = d => hashStr(JSON.stringify([d.name, d.pockets, d.pages, d.spreads, d.member || null]));
const ownedList = d => d.items.filter(i => i.k === 'card' && i.own).map(i => i.cid);
const baseOf = d => ({ struct: structSig(d), settings: settingsSig(d), owned: ownedList(d) });
const dataSig = d => hashStr(JSON.stringify(d));

function mergeBinder(local, server, serverAt, base) {
  const L = binderData(local), S = server;
  const localNewer = (local.editedAt || 0) > Date.parse(serverAt || 0);
  const lStruct = structSig(L) !== base.struct, sStruct = structSig(S) !== base.struct;
  const lSet = settingsSig(L) !== base.settings, sSet = settingsSig(S) !== base.settings;
  const st = sStruct && (!lStruct || !localNewer) ? S : L;
  const se = sSet && (!lSet || !localNewer) ? S : L;
  const out = { name: se.name, pockets: se.pockets, pages: se.pages, spreads: se.spreads, member: se.member || null, created: L.created || S.created,
    items: JSON.parse(JSON.stringify(st.items)), sections: JSON.parse(JSON.stringify(st.sections || {})) };
  const was = new Set(base.owned || []), lo = {}, so = {};
  L.items.forEach(i => { if (i.k === 'card') lo[i.cid] = !!i.own; });
  S.items.forEach(i => { if (i.k === 'card') so[i.cid] = !!i.own; });
  out.items.forEach(i => {
    if (i.k !== 'card') return;
    const c = i.cid, lChanged = c in lo && lo[c] !== was.has(c);
    i.own = lChanged ? lo[c] : (c in so ? so[c] : (c in lo ? lo[c] : !!i.own));
  });
  return out;
}

const Sync = {

  hasStoredSession() { try { return Object.keys(localStorage).some(k => /^sb-.*-auth-token$/.test(k)); } catch (e) { return false; } },

  async load() {

  async start() {

    if (this.meta.uid !== uid) this.meta = { uid, binders: {}, account: null, tomb: [], pics: {} };

    insAll().forEach(s => { if (s.hasImg && !(s.id in this.meta.pics)) this.meta.pics[s.id] = 'up'; });
    this.saveMeta();
    this.setStatus('syncing');
    await this.pull();
    this.subscribe();
    await this.push();
  },
  stop() {
    if (this.channel) { this.sb.removeChannel(this.channel); this.channel = null; }
    this.setStatus('off');
  },
  subscribe() {
    if (this.channel || !this.user) return;
    let t = 0;
    const soon = () => { clearTimeout(t); t = setTimeout(() => this.pull(), 400); };
    this.channel = this.sb.channel('mine')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'binders', filter: `owner=eq.${this.user.id}` }, soon)

  /* ---- download ---- */
  async pull() {
    if (!this.user) return;
    if (this.busy) { this.again = 'pull'; return; }
    this.busy = true;
    try {
      const { data: rows, error } = await this.sb.from('binders').select('id,data,version,deleted,updated_at');
      if (error) throw error;
      let changed = false;
      for (const row of rows) {
        const m = this.meta.binders[row.id];
        const k = store.binders.findIndex(b => b.id === row.id);
        const local = store.binders[k];
        if (m && row.version <= m.v) continue;                       // nothing new (or our own echo)
        if (row.deleted) {

          this.meta.binders[row.id] = { v: row.version, sig: null, base: baseOf(row.data), deleted: true };

        }
        if (!local) {
          store.binders.push({ id: row.id, ...row.data });
          this.meta.binders[row.id] = { v: row.version, sig: dataSig(row.data), base: baseOf(row.data) };
          changed = true; continue;
        }
        const unchanged = m && dataSig(binderData(local)) === m.sig;
        const next = unchanged ? row.data : mergeBinder(local, row.data, row.updated_at, m ? m.base : baseOf({ items: [], sections: {} }));
        Object.assign(local, next); if (unchanged) delete local.editedAt; else this.again = 'push';
        this.meta.binders[row.id] = { v: row.version, sig: dataSig(row.data), base: baseOf(row.data) };
        changed = true;
      }
      // account: family members + title-card sheet
      const { data: acc } = await this.sb.from('account_data').select('members,inserts,version').maybeSingle();
      const ma = this.meta.account;
      if (acc && (!ma || acc.version > ma.v)) {
        const localSig = hashStr(JSON.stringify([store.members || [], ...insSig(ins)]));
        const unchanged = ma && localSig === ma.sig;
        if (unchanged || !ma) {
          const mem = new Map((acc.members || []).map(x => [x.id, x]));
          if (!unchanged) (store.members || []).forEach(x => { if (!mem.has(x.id)) mem.set(x.id, x); });   // first sign-in: keep both
          store.members = [...mem.values()];

        } else {
          const mem = new Map((acc.members || []).map(x => [x.id, x]));
          (store.members || []).forEach(x => mem.set(x.id, x));
          store.members = [...mem.values()];
          const have = new Set((ins.saved || []).map(x => x.id));   // keep designs saved on the other device too
          const extra = (acc.inserts?.saved || []).filter(x => !have.has(x.id));
          if (extra.length) { ins.saved = [...(ins.saved || []), ...extra]; saveInsLocal(); }
        }
        this.meta.account = { v: acc.version, sig: hashStr(JSON.stringify([acc.members || [], ...insSig(acc.inserts)])) };

    finally { this.busy = false; this.flushAgain(); }
  },
  async fetchPictures() {
    for (const s of insAll()) {
      if (!s.hasImg || await imgDB.get(s.id)) continue;
      const { data } = await this.sb.storage.from(PIC_BUCKET).download(`${this.user.id}/${s.id}.jpg`);
      if (!data) continue;

  },

  /* ---- upload ---- */
  schedule() { if (!this.user) return; clearTimeout(this.timer); this.setStatus('saving'); this.timer = setTimeout(() => this.push(), 1200); },
  flushAgain() { const a = this.again; this.again = false; if (a === 'pull') this.pull(); else if (a) this.push(); },
  async push() {
    if (!this.user || this.deleting) return;
    if (this.busy) { this.again = this.again || 'push'; return; }
    if (!navigator.onLine) return this.setStatus('offline');
    this.busy = true;
    try {
      for (const id of [...this.meta.tomb]) {
        const { data: row } = await this.sb.from('binders').select('version').eq('id', id).maybeSingle();
        if (row) {
          const { error } = await this.sb.from('binders').update({ deleted: true, version: row.version + 1 }).eq('id', id);
          if (error) throw error;
          this.meta.binders[id] = { ...(this.meta.binders[id] || {}), v: row.version + 1, deleted: true, sig: null };
        }
        this.meta.tomb = this.meta.tomb.filter(x => x !== id);
      }
      for (const b of store.binders) await this.pushBinder(b);
      await this.pushAccount();
      await this.pushPictures();
      this.saveMeta();
      this.setStatus('ok');
    } catch (e) { this.saveMeta(); this.setStatus(navigator.onLine ? 'error' : 'offline'); }
    finally { this.busy = false; this.flushAgain(); }
  },
  async pushBinder(b, tries = 0) {
    const d = binderData(b), sig = dataSig(d), m = this.meta.binders[b.id];
    if (m && m.sig === sig && !m.deleted) return;
    if (!b.editedAt) b.editedAt = Date.now();
    if (!m) {
      const { error } = await this.sb.from('binders').insert({ id: b.id, data: d, version: 1 });
      if (!error) { this.meta.binders[b.id] = { v: 1, sig, base: baseOf(d) }; delete b.editedAt; return; }
      if (error.code !== '23505') throw error;
    } else {
      const nv = m.v + 1;
      const { data: rows, error } = await this.sb.from('binders').update({ data: d, version: nv, deleted: false }).eq('id', b.id).eq('version', m.v).select('version');
      if (error) throw error;
      if (rows.length) { this.meta.binders[b.id] = { v: nv, sig, base: baseOf(d) }; delete b.editedAt; return; }
    }
    // Someone else changed it first: merge with their version and try again.
    if (tries > 3) throw new Error('sync conflict');
    const { data: row, error } = await this.sb.from('binders').select('data,version,updated_at').eq('id', b.id).single();
    if (error) throw error;
    Object.assign(b, mergeBinder(b, row.data, row.updated_at, m ? m.base : baseOf({ items: [], sections: {} })));
    this.meta.binders[b.id] = { v: row.version, sig: dataSig(row.data), base: baseOf(row.data) };
    saveLocal(); render();
    return this.pushBinder(b, tries + 1);
  },
  async pushAccount(tries = 0) {
    const payload = { members: store.members || [], inserts: ins };
    const sig = hashStr(JSON.stringify([payload.members, ...insSig(ins)])), m = this.meta.account;
    if (m && m.sig === sig) return;
    if (!m) {
      const { error } = await this.sb.from('account_data').insert(payload);
      if (!error) { this.meta.account = { v: 1, sig }; return; }
      if (error.code !== '23505') throw error;
    } else {
      const { data: rows, error } = await this.sb.from('account_data').update({ ...payload, version: m.v + 1 }).eq('version', m.v).select('version');
      if (error) throw error;
      if (rows.length) { this.meta.account = { v: m.v + 1, sig }; return; }
    }
    if (tries > 3) throw new Error('sync conflict');
    const { data: acc } = await this.sb.from('account_data').select('members,inserts,version').single();
    const mem = new Map((acc.members || []).map(x => [x.id, x])); (store.members || []).forEach(x => mem.set(x.id, x));
    store.members = [...mem.values()]; saveLocal();
    this.meta.account = { v: acc.version, sig: 'merge' };
    return this.pushAccount(tries + 1);
  },
  async pushPictures() {
    for (const [id, what] of Object.entries(this.meta.pics)) {
      const path = `${this.user.id}/${id}.jpg`;
      if (what === 'up') {
        const url = await imgDB.get(id);
        if (url) {
          const blob = await (await fetch(url)).blob();

          if (error) throw error;

      delete this.meta.pics[id];
    }
  },
  pictureChanged(id, removed) { if (!this.user) return; this.meta.pics[id] = removed ? 'del' : 'up'; this.saveMeta(); this.schedule(); },
  binderDeleted(id) { if (!this.user) return; if (this.meta.binders[id]) { this.meta.tomb.push(id); this.saveMeta(); } this.schedule(); },
  pending() { return !!(this.meta.tomb?.length || Object.keys(this.meta.pics || {}).length || store.binders.some(b => { const m = this.meta.binders?.[b.id]; return !m || m.sig !== dataSig(binderData(b)); })); },

  /* ---- sign in / out ---- */
  async sendCode(email) {
    const sb = await this.load(); if (!sb) throw new Error('Can’t reach the sign-in service. Check your internet.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: NATIVE ? APP_LINK : location.origin + location.pathname } });
    if (error) throw error;
  },
  async verify(email, token) {

  },
  async deleteAccount() {   // removes the account and everything in it, then clears this device
    this.deleting = true; clearTimeout(this.timer); this.stop();

    if (error) throw error;
    await sb.auth.signOut({ scope: 'local' }).catch(() => {});
    for (const s of insAll()) await imgDB.del(s.id);
    try { [LS_KEY, INS_KEY, SYNC_KEY].forEach(k => localStorage.removeItem(k)); sessionStorage.setItem('binderBlueprint.deleted', '1'); } catch (e) {}
    location.replace(location.pathname + '#home'); location.reload();
  },
  async signOut() {
    clearTimeout(this.timer);
    if (navigator.onLine) await this.push();

  async versions(id) {

    if (error) throw error; return data;
  },
  async versionData(vid) {
    const { data, error } = await this.sb.from('binder_versions').select('data').eq('vid', vid).single();
    if (error) throw error; return data.data;
  },
};
