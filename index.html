        changed = true;
      }
      this.saveMeta();
      if (changed) { saveLocal(); render(); }
      await this.fetchPictures();
      this.setStatus(!navigator.onLine ? 'offline' : this.pending() ? 'saving' : 'ok');
    } catch (e) { this.setStatus(navigator.onLine ? 'error' : 'offline'); }
    finally { this.busy = false; this.flushAgain(); }
  },
  async fetchPictures() {
    for (const s of ins.slots) {
      if (!s.hasImg || await imgDB.get(s.id)) continue;
      const { data } = await this.sb.storage.from(PIC_BUCKET).download(`${this.user.id}/${s.id}.jpg`);
      if (!data) continue;
      const url = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(data); });
      await imgDB.set(s.id, url); delete imgEls[s.id];
      if (tab === 'inserts') render();
    }
  },

  /* ---- upload ---- */
  schedule() { if (!this.user) return; clearTimeout(this.timer); this.setStatus('saving'); this.timer = setTimeout(() => this.push(), 1200); },
  flushAgain() { const a = this.again; this.again = false; if (a === 'pull') this.pull(); else if (a) this.push(); },
  async push() {
    if (!this.user) return;
    if (this.busy) { this.again = this.again || 'push'; return; }
    if (!navigator.onLine) return this.setStatus('offline');
    this.busy = true;
    try {
      for (const id of [...this.meta.tomb]) {
        const { data: row } = await this.sb.from('binders').select('version').eq('id', id).maybeSingle();
        if (row) {
          const { error } = await this.sb.from('binders').update({ deleted: true, version: row.version + 1 }).eq('id', id);
          if (error) throw error;
          this.meta.binders[id] = { ...(this.meta.binders[id] || {}), v: row.version + 1, deleted: true, sig: null };
        }
        this.meta.tomb = this.meta.tomb.filter(x => x !== id);
      }
      for (const b of store.binders) await this.pushBinder(b);
      await this.pushAccount();
      await this.pushPictures();
      this.saveMeta();
      this.setStatus('ok');
    } catch (e) { this.saveMeta(); this.setStatus(navigator.onLine ? 'error' : 'offline'); }
    finally { this.busy = false; this.flushAgain(); }
  },
  async pushBinder(b, tries = 0) {
    const d = binderData(b), sig = dataSig(d), m = this.meta.binders[b.id];
    if (m && m.sig === sig && !m.deleted) return;
    if (!b.editedAt) b.editedAt = Date.now();
    if (!m) {
      const { error } = await this.sb.from('binders').insert({ id: b.id, data: d, version: 1 });
      if (!error) { this.meta.binders[b.id] = { v: 1, sig, base: baseOf(d) }; delete b.editedAt; return; }
      if (error.code !== '23505') throw error;
    } else {
      const nv = m.v + 1;
      const { data: rows, error } = await this.sb.from('binders').update({ data: d, version: nv, deleted: false }).eq('id', b.id).eq('version', m.v).select('version');
      if (error) throw error;
      if (rows.length) { this.meta.binders[b.id] = { v: nv, sig, base: baseOf(d) }; delete b.editedAt; return; }
    }
    // Someone else changed it first: merge with their version and try again.
    if (tries > 3) throw new Error('sync conflict');
    const { data: row, error } = await this.sb.from('binders').select('data,version,updated_at').eq('id', b.id).single();
    if (error) throw error;
    Object.assign(b, mergeBinder(b, row.data, row.updated_at, m ? m.base : baseOf({ items: [], sections: {} })));
    this.meta.binders[b.id] = { v: row.version, sig: dataSig(row.data), base: baseOf(row.data) };
    saveLocal(); render();
    return this.pushBinder(b, tries + 1);
  },
  async pushAccount(tries = 0) {
    const payload = { members: store.members || [], inserts: ins };
    const sig = hashStr(JSON.stringify([payload.members, ins.slots])), m = this.meta.account;
    if (m && m.sig === sig) return;
    if (!m) {
      const { error } = await this.sb.from('account_data').insert(payload);
      if (!error) { this.meta.account = { v: 1, sig }; return; }
      if (error.code !== '23505') throw error;
    } else {
      const { data: rows, error } = await this.sb.from('account_data').update({ ...payload, version: m.v + 1 }).eq('version', m.v).select('version');
      if (error) throw error;
      if (rows.length) { this.meta.account = { v: m.v + 1, sig }; return; }
    }
    if (tries > 3) throw new Error('sync conflict');
    const { data: acc } = await this.sb.from('account_data').select('members,inserts,version').single();
    const mem = new Map((acc.members || []).map(x => [x.id, x])); (store.members || []).forEach(x => mem.set(x.id, x));
    store.members = [...mem.values()]; saveLocal();
    this.meta.account = { v: acc.version, sig: 'merge' };
    return this.pushAccount(tries + 1);
  },
  async pushPictures() {
    for (const [id, what] of Object.entries(this.meta.pics)) {
      const path = `${this.user.id}/${id}.jpg`;
      if (what === 'up') {
        const url = await imgDB.get(id);
        if (url) {
          const blob = await (await fetch(url)).blob();
          const { error } = await this.sb.storage.from(PIC_BUCKET).upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
          if (error) throw error;
        }
      } else if (what === 'del') {
        await this.sb.storage.from(PIC_BUCKET).remove([path]);
      }
      delete this.meta.pics[id];
    }
  },
  pictureChanged(id, removed) { if (!this.user) return; this.meta.pics[id] = removed ? 'del' : 'up'; this.saveMeta(); this.schedule(); },
  binderDeleted(id) { if (!this.user) return; if (this.meta.binders[id]) { this.meta.tomb.push(id); this.saveMeta(); } this.schedule(); },
  pending() { return !!(this.meta.tomb?.length || Object.keys(this.meta.pics || {}).length || store.binders.some(b => { const m = this.meta.binders?.[b.id]; return !m || m.sig !== dataSig(binderData(b)); })); },

  /* ---- sign in / out ---- */
  async sendCode(email) {
    const sb = await this.load(); if (!sb) throw new Error('Can’t reach the sign-in service. Check your internet.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
  },
  async verify(email, token) {
    const { error } = await this.sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) throw error;
  },
  async signOut() {
    clearTimeout(this.timer);
    if (navigator.onLine) await this.push();
    await this.sb.auth.signOut();
    // Leave nothing from this account on a shared device.
    for (const s of ins.slots) await imgDB.del(s.id);
    try { [LS_KEY, INS_KEY, SYNC_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) {}
    location.replace(location.pathname + '#home'); location.reload();
  },
  async versions(id) {
    const { data, error } = await this.sb.from('binder_versions').select('vid,saved_at').eq('binder_id', id).order('saved_at', { ascending: false }).limit(30);
    if (error) throw error; return data;
  },
  async versionData(vid) {
    const { data, error } = await this.sb.from('binder_versions').select('data').eq('vid', vid).single();
    if (error) throw error; return data.data;
  },
};
window.addEventListener('online', () => Sync.push());
window.addEventListener('offline', () => Sync.user && Sync.setStatus('offline'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.user) Sync.pull(); });

/* ---------------- account & family UI ---------------- */
function paintAccount() {
  const el = $('#acct'); if (!el) return;
  if (!Sync.user) { el.innerHTML = 'Sign in'; el.className = 'acct'; el.title = 'Sign in to save your binders and use them on any device'; return; }
  const label = { ok: 'Saved', saving: 'Saving…', syncing: 'Syncing…', offline: 'Offline', error: 'Not saved', off: '' }[Sync.status] || '';
  el.className = 'acct in ' + Sync.status;
  el.innerHTML = `<i class="dot"></i>${label}`;
  el.title = Sync.user.email;
}
function openAccount() {
  if (!Sync.user) return openSignIn();
  const pend = Sync.pending();
  const m = openModal(`<div class="mhead"><h2>Your account</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="box">
      <div><b>${esc(Sync.user.email)}</b><br><span class="small muted">${Sync.status === 'ok' ? 'Everything is saved to your account.' : Sync.status === 'offline' ? 'You’re offline. Changes are kept here and upload when you’re back online.' : Sync.status === 'error' ? 'Some changes haven’t uploaded yet. They’re safe on this device and will retry.' : 'Saving…'}</span></div>
      <p class="small muted" style="margin:0">Sign in with the same email on any phone, tablet or computer to see the same binders.</p>
    </div>
    ${familyBoxHTML()}
    <div class="mfoot"><button class="btn danger" id="aOut">Sign out</button><button class="btn primary" data-close>Done</button></div>`);
  wireFamily(m);
  $('#aOut', m).onclick = () => {
    const go = () => Sync.signOut();
    if (pend && !navigator.onLine) return confirmBox('Sign out while offline?', 'Some changes haven’t uploaded yet and will be lost from this device.', 'Sign out anyway', go);
    confirmBox('Sign out?', 'Your binders stay safe in your account. This device will be cleared until you sign in again.', 'Sign out', go);
  };
}
function openSignIn() {
  const m = openModal(`<div class="mhead"><h2>Sign in</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="box" id="siBox">
      <p class="muted" style="margin:0">Save your binders to your account and use them on any device. One account for the whole family.</p>
      <form id="siForm" class="field" style="margin:0"><span>Grown-up’s email</span>
        <input class="inp" id="siEmail" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
        <button class="btn primary" id="siSend">Email me a code</button></form>
    </div>
    <p class="small muted">No password needed. ${store.binders.length ? 'The binders on this device are added to your account.' : ''}</p>`);
  setTimeout(() => $('#siEmail', m)?.focus(), 50);
  Sync.load();
  $('#siForm', m).onsubmit = async e => {
    e.preventDefault();
    const email = $('#siEmail', m).value.trim(), btn = $('#siSend', m);
    btn.disabled = true; btn.textContent = 'Sending…';
    try { await Sync.sendCode(email); }
    catch (err) { btn.disabled = false; btn.textContent = 'Email me a code'; return toast(/rate|seconds/i.test(err.message) ? 'Please wait a minute before asking for another code.' : (err.message || 'That didn’t work. Try again.')); }
    $('#siBox', m).innerHTML = `<p style="margin:0">We emailed a 6-digit code to <b>${esc(email)}</b>. It can take a minute.</p>
      <form id="siCodeForm" class="field" style="margin:0"><span>Code</span>
        <input class="inp code" id="siCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456">
        <button class="btn primary" id="siGo">Sign in</button></form>
      <p class="small muted" style="margin:0">Got a link instead of a code? Open it on this device and you’ll be signed in.</p>`;
    $('#siCode', m).focus();
    $('#siCodeForm', m).onsubmit = async ev => {
      ev.preventDefault();
      const code = $('#siCode', m).value.replace(/\D/g, ''), go = $('#siGo', m);
      if (code.length < 6) return toast('Type the 6-digit code from the email.');
      go.disabled = true; go.textContent = 'Checking…';
      try { await Sync.verify(email, code); closeModal(); toast('Signed in. Your binders are saving to your account.'); }
      catch (err) { go.disabled = false; go.textContent = 'Sign in'; toast('That code didn’t work. Check it, or ask for a new one.'); }
    };
  };
}

/* family members (profiles) */
const memberName = id => (store.members || []).find(x => x.id === id)?.name;
function familyBoxHTML() {
  const ms = store.members || [];
  return `<div class="box" id="famBox"><h2 style="font-size:18px">Family</h2>
    <p class="small muted" style="margin:0">Add names so each binder can belong to someone. Kids don’t need their own email.</p>
    <div class="blist">${ms.map(x => `<div class="brow"><input class="inp" data-mname="${x.id}" value="${esc(x.name)}" maxlength="24" aria-label="Name"><button class="icon-btn" data-mdel="${x.id}" aria-label="Remove ${esc(x.name)}" style="color:var(--need)">✕</button></div>`).join('')}</div>
    <form id="famAdd" style="display:flex;gap:8px"><input class="inp" id="famNew" maxlength="24" placeholder="Name, e.g. Josie"><button class="btn">Add</button></form></div>`;
}
function wireFamily(m) {
  const box = $('#famBox', m); if (!box) return;
  const redraw = () => { box.outerHTML = familyBoxHTML(); wireFamily(m); };
  $('#famAdd', box).onsubmit = e => { e.preventDefault(); const n = $('#famNew', box).value.trim(); if (!n) return; (store.members ||= []).push({ id: uid(), name: n }); commit(); redraw(); $('#famNew', m)?.focus(); };
  $$('[data-mname]', box).forEach(i => i.onchange = () => { const x = store.members.find(y => y.id === i.dataset.mname); if (x) { x.name = i.value.trim() || x.name; commit(); } });
  $$('[data-mdel]', box).forEach(b => b.onclick = () => {
    const id = b.dataset.mdel;
    store.members = store.members.filter(x => x.id !== id);
    store.binders.forEach(x => { if (x.member === id) x.member = null; });
    commit(); redraw();
  });
}
function openFamily() {
  const m = openModal(`<div class="mhead"><h2>Family</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>${familyBoxHTML()}<div class="mfoot"><button class="btn primary" data-close>Done</button></div>`);
  wireFamily(m);
}
$('#acct').onclick = () => openAccount();
paintAccount();
if (Sync.hasStoredSession() || /[?&]code=/.test(location.search)) Sync.load();

/* ---------------- light / dark ---------------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintTheme() {
  const dark = isDark();
  $('#theme').innerHTML = dark ? `${SUN}Light` : `${MOON}Dark`;
  $('meta[name=theme-color]').content = dark ? '#0E1619' : '#EEF2F4';
}
$('#theme').onclick = () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('binderBlueprint.theme', t); } catch (e) {}
  paintTheme();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintTheme);
paintTheme();

/* ---------------- events ---------------- */
$('#fab').onclick = () => openAdd();
$('#back').onclick = () => go('home');
$('#tabs').addEventListener('click', e => {
  const a = e.target.closest('a[data-tab]'); if (!a) return;
  e.preventDefault(); go(a.dataset.tab);
});

$('#main').addEventListener('click', e => {
  if (DRAG.justDropped || tab === 'inserts') return;
  const b = cur(), t = e.target.closest('button, [data-i]'); if (!t) return;
  if (!b && !t.dataset.act && !t.dataset.open && t.dataset.who === undefined) return;
  const d = t.dataset;
  if (d.i !== undefined) {
    const it = b.items[+d.i];
    if (store.tapMode === 'own' && it.k === 'card') toggleOwn(+d.i);
    else openItem(+d.i);
    return;
  }
  if (d.act === 'add') return openAdd();
  if (d.act === 'create') return openCreate();
  if (d.act === 'inserts') return go('inserts');
  if (d.act === 'family') return openFamily();
  if (d.act === 'signin') return openSignIn();
  if (d.who !== undefined) { store.who = d.who; return commit(); }
  if (d.sw !== undefined) { b.member = d.sw || null; return commit(); }
  if (d.restore) {
    return confirmBox('Restore this version?', 'Your binder goes back to how it was then. You can restore the current one again later from this list.', 'Restore', async () => {
      try { const data = await Sync.versionData(+d.restore); const keep = b.id; Object.assign(b, data, { id: keep, editedAt: Date.now() }); commit('Restored'); }
      catch (e) { toast('Couldn’t restore. Check your internet.'); }
    });
  }
  if (d.act === 'showall') { store.showAll = true; return commit(); }
  if (d.act === 'showless') { store.showAll = false; return commit(); }
  if (d.tap) { store.tapMode = d.tap; return commit(); }
  if (d.zoom) { store.zoom = Math.max(0.6, Math.min(1.8, Math.round((store.zoom + d.zoom * 0.2) * 10) / 10)); return commit(); }
  if (d.insert) return openAdd(d.insert);
  if (d.ownAll) {
    const its = b.items.filter(x => x.sec === d.ownAll && x.k === 'card'), all = its.every(x => x.own);
    its.forEach(x => x.own = !all); return commit(all ? 'Marked as missing' : 'Marked as have');
  }
  if (d.up || d.down) {
    const sec = d.up || d.down, order = sectionOrder(b), k = order.indexOf(sec), k2 = k + (d.up ? -1 : 1);
    if (k2 < 0 || k2 >= order.length) return;
    [order[k], order[k2]] = [order[k2], order[k]];
    b.items = order.flatMap(s => b.items.filter(x => x.sec === s));
    return commit();
  }
  if (d.delsec) {
    const label = (b.sections[d.delsec] || {}).label || 'this part';
    return confirmBox('Remove this?', `Take <b>${esc(label)}</b> out of the binder plan?`, 'Remove', () => {
      b.items = b.items.filter(x => x.sec !== d.delsec); delete b.sections[d.delsec]; commit('Removed');
    });
  }
  if (d.pockets) { const p = +d.pockets; if (p !== b.pockets) { b.pockets = p; commit(`Now a ${p}-pocket binder. Everything moved to fit.`); } return; }
  if (d.pages) { b.pages = Math.max(1, Math.min(200, b.pages + +d.pages)); return commit(); }
  if (d.open) { store.cur = d.open; save(); return go('binder'); }
  if (d.dup) {
    const src = store.binders.find(x => x.id === d.dup), copy = JSON.parse(JSON.stringify(src));
    copy.id = uid(); copy.name = src.name + ' (copy)'; store.binders.push(copy); store.cur = copy.id; save(); go('binder'); return toast('Copy made. You are in the copy now.');
  }
  if (d.delb) {
    const x = store.binders.find(y => y.id === d.delb);
    return confirmBox('Delete binder?', `Delete <b>${esc(x.name)}</b> and its whole plan? This can't be undone.`, 'Delete', () => {
      store.binders = store.binders.filter(y => y.id !== d.delb);
      Sync.binderDeleted(d.delb);
      if (store.cur === d.delb) store.cur = null;
      save(); go('home'); toast('Binder deleted');
    });
  }
  if (d.act === 'print') {
    if (framed) return toast('Printing works on your own site. This preview can’t open the print window.');
    printWith('guide');
  }
});
$('#main').addEventListener('change', e => {
  const b = cur(), t = e.target;
  if (t.id === 'sName') { b.name = t.value.trim() || 'My binder'; commit(); }
  if (t.id === 'sPages') { b.pages = Math.max(1, Math.min(200, parseInt(t.value) || 1)); commit(); }
  if (t.id === 'sSpreads') { b.spreads = t.checked; commit(); }
  if (t.dataset.g) { store.guide[t.dataset.g] = t.checked; commit(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------------- start ---------------- */
render();
getSets();
</script>
