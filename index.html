<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binder Blueprint</title>
<meta name="description" content="Plan your real trading card binder before you sleeve a single card.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<meta name="theme-color" content="#EEF2F4">
<script>try{var t=localStorage.getItem('binderBlueprint.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E2E8EC; --fg:#15232B; --muted:#5B6B74; --line:#D3DCE1;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --have:#1E8A4C; --have-bg:#DDF2E5; --need:#C2410C; --need-bg:#FBE6DA;
  --foil:linear-gradient(115deg,#7FD6D9 0%,#C9B6F2 35%,#F6D38A 65%,#8FE0B5 100%);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --binder:#1B2B33; --binder-2:#263a44; --page:#F7F9FA;
  --zoom:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0E1619; --surface:#16222A; --sunk:#0A1114; --fg:#E4ECEF; --muted:#93A4AC; --line:#26353D;
  --accent:#3FC1C9; --accent-ink:#06282B; --have:#5BD08C; --have-bg:#123224; --need:#F59362; --need-bg:#3A1D10;
  --binder:#050A0C; --binder-2:#0d171b; --page:#1B2830; color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0E1619; --surface:#16222A; --sunk:#0A1114; --fg:#E4ECEF; --muted:#93A4AC; --line:#26353D;
  --accent:#3FC1C9; --accent-ink:#06282B; --have:#5BD08C; --have-bg:#123224; --need:#F59362; --need-bg:#3A1D10;
  --binder:#050A0C; --binder-2:#0d171b; --page:#1B2830; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:500 16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:6px 0 0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;line-height:1.15}
h3{font-family:var(--display);font-weight:800;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num,.mono{font-family:var(--mono)}

/* ---------- header ---------- */
header{display:flex;flex-direction:column;gap:6px}
.foil{height:6px;border-radius:3px;background:var(--foil)}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin:0}
.who{font-size:13px;color:var(--muted)}
.bchip{border:0;background:none;color:var(--accent);font:600 13px var(--body);padding:0;text-align:right}
.hrow{display:flex;align-items:center;gap:10px;min-height:36px}
.acct{margin-left:auto;display:inline-flex;align-items:center;gap:7px;min-height:36px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 13px var(--body);padding:6px 12px;border-radius:999px;white-space:nowrap}
.acct.in{border-color:var(--line);color:var(--fg);font-weight:600}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--have)}
.acct.saving .dot,.acct.syncing .dot{background:#E0A030;animation:blink 1s infinite}
.acct.offline .dot{background:var(--muted)}
.acct.error .dot{background:var(--need)}
@keyframes blink{50%{opacity:.3}}
.hrow .acct + .theme{margin-left:0}
.inp.code{font:600 24px var(--mono);letter-spacing:.3em;text-align:center}
.mtag{display:inline-block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:6px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.nudge{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.nudge p{margin:0;flex:1;font-size:14px;color:var(--muted)}
#famBox .brow{flex-wrap:nowrap;padding:6px 8px}
#famBox .brow .inp{flex:1;width:auto;min-width:0}
.vlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.vrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.vrow span{flex:1}
.theme{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:6px 12px;border-radius:999px}
.theme svg{width:16px;height:16px}
.back{border:0;background:transparent;color:var(--accent);font:700 15px var(--body);padding:8px 8px 8px 0;min-height:40px;align-self:flex-start}
.home{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hero .btn{font-size:18px;padding:16px 28px;min-height:56px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:520px}
.steps div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--sunk);color:var(--fg);display:grid;place-items:center;font:800 14px var(--body)}
.btile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;text-align:left;width:100%}
.btile b{font-size:17px;display:block}
.btile .meter{grid-column:1/-1;margin:0}
.btile .go{color:var(--accent);font-weight:800;font-size:20px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:600 15px var(--body);padding:10px 6px;border-radius:9px;white-space:nowrap}
.tabs a.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:560px){
  .tabs{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:0 0 auto;font-size:14px;padding:9px 12px;scroll-snap-align:start}
}
main{display:flex;flex-direction:column;gap:14px}
.banner:empty{display:none}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--fg)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:transparent;color:var(--fg);font:700 15px var(--body);padding:11px 14px;border-radius:10px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.btn.danger{color:var(--need)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--fg);width:36px;height:36px;border-radius:9px;font:700 15px var(--body);display:inline-grid;place-items:center;flex:none;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 20px;font:700 16px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-radius:9px;min-height:36px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- stats / toolbars ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--foil)}
.meter.over i{background:var(--need)}
.warn{background:var(--need-bg);border:1px solid var(--need);color:var(--need);border-radius:12px;padding:10px 14px;font-weight:700}
.warn span{font-weight:500}

/* ---------- binder view ---------- */
.spreads{display:flex;flex-direction:column;gap:18px;align-items:center}
.spread-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.spread-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.spread{display:flex;gap:6px;background:linear-gradient(90deg,var(--binder),var(--binder-2) 50%,var(--binder));padding:12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.spread.single{background:var(--binder)}
.page{--pw:calc(min(42vw,330px)*var(--zoom));width:var(--pw);background:var(--page);border-radius:7px;padding:6px;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;align-content:start;position:relative}
.spread.single .page{--pw:calc(min(86vw,440px)*var(--zoom))}
.page.cover{background:transparent;display:grid;place-items:center;color:#7d929c;font-size:12px;text-transform:uppercase;letter-spacing:.08em;text-align:center;border:1.5px dashed rgba(255,255,255,.14)}
.page.over{background:var(--need-bg)}
.page .pno{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:500 10px var(--mono);color:#7d929c;transform:translateY(100%);padding-top:2px}
.page.over .pno{color:var(--need)}
.pk{aspect-ratio:63/88;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden;border:none;padding:0;display:block;width:100%}
.pk.blank{background:var(--sunk);opacity:.7}
.pk.empty{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 6px,transparent 6px,transparent 12px);box-shadow:inset 0 0 0 1.5px var(--line)}
.pk .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;text-align:center;padding:4px;background:var(--sunk);color:var(--muted);font:600 calc(9px*var(--zoom)) var(--body);line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.pk .ph span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.pk .ph.under{display:none}
.pk.broken .ph.under{display:flex}
.pk .ph b{font:500 calc(11px*var(--zoom)) var(--mono);color:var(--fg)}
.pk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pk.need img,.pk.need .ph{filter:grayscale(1);opacity:.35}
.pk.need{box-shadow:inset 0 0 0 1.5px var(--line)}
.pk .tag{position:absolute;left:3px;bottom:3px;font:500 9px var(--mono);background:var(--surface);color:var(--muted);border-radius:4px;padding:0 4px;line-height:1.6;opacity:.95}
.pk.need:has(.ph:not(.under)) .tag{display:none}
.pk.own .tag{left:auto;right:3px;top:3px;bottom:auto;width:16px;height:16px;padding:0;border-radius:50%;background:var(--have);color:#fff;display:grid;place-items:center;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pk.sel{outline:3px solid var(--accent);outline-offset:-3px}
.pk.title,.titlepage{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:var(--display);font-weight:800;padding:4px;line-height:1.1;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pk.title{font-size:calc(11px*var(--zoom))}
.titlepage{grid-column:1/-1;aspect-ratio:auto;border-radius:5px;font-size:calc(22px*var(--zoom));border:none;min-height:100%}
.pk.energy{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(10px*var(--zoom));gap:3px}
.pk.energy .orb{width:46%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.8)}
.pk.over-pk::after{content:"";position:absolute;inset:0;background:rgba(194,65,12,.18)}
.more-pages{text-align:center}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty-state h2{color:var(--fg);margin-bottom:6px}

/* ---------- contents ---------- */
.intro{margin:0;color:var(--muted)}
.secs{display:flex;flex-direction:column;gap:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.sec .sw{width:8px;align-self:stretch;border-radius:4px;flex:none}
.sec .info{flex:1;min-width:0}
.sec .info b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ins{align-self:flex-start;border:0;background:none;color:var(--accent);font:700 14px var(--body);padding:2px 4px}

/* ---------- panels / forms ---------- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span:first-child,.where label,label.lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;min-height:42px}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickopt{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:112px;font:700 14px var(--body);color:var(--fg)}
.pickopt.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.mini{display:grid;gap:2px;background:var(--binder);padding:4px;border-radius:5px}
.mini i{display:block;width:12px;height:17px;background:#e9eef1;border-radius:1.5px}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper input{width:80px;text-align:center}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.brow.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.brow .grow{flex:1;min-width:140px}
.brow b{font-size:16px}
.openlbl{font-weight:700;font-size:13px;color:var(--accent)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,12,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.modal{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.wide{max-width:760px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h2{flex:1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 4px}
.addtabs{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.setlist{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.setlist button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600}
.setlist button span{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.setlist button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.where{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.where{grid-template-columns:1fr}}
.where label{display:flex;flex-direction:column;gap:4px}
.where select{text-transform:none;letter-spacing:0}
.preview{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px;background:var(--have-bg);border:1px solid var(--have);color:var(--fg)}
.preview.bad{background:var(--need-bg);border-color:var(--need)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:300px;overflow:auto}
.results{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px 8px;max-height:min(46vh,380px)}
.res{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--fg);min-width:0}
.res .pk{--zoom:.9}
.res.sel .pk{outline:3px solid var(--accent);outline-offset:-3px}
.res .cap{font-size:11px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.res .cap b{display:block;color:var(--fg);font-size:12px}
.results .pk .chk{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:900;display:none;place-items:center;z-index:2}
.results .res.sel .chk{display:grid}
.results .pk.own .tag{display:none}
.erow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .dot{width:24px;height:24px;border-radius:50%}
.erow b{flex:1}
.erow .qty{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 3px var(--fg)}
.detail{display:flex;gap:16px;align-items:flex-start}
.detail .dimg{width:150px;flex:none}
.detail .dimg .pk{--zoom:1.4;border-radius:7px}
.detail .grow{flex:1;min-width:0}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hn{display:flex;width:100%}
.hn button{flex:1;min-height:44px;font-size:15px}
.hn button.on.have{background:var(--have-bg);color:var(--have)}
.hn button.on.need{background:var(--need-bg);color:var(--need)}
.havebtn{width:100%}
.havebtn.on{background:var(--have-bg);color:var(--have);border-color:var(--have)}
.havebtn.off{background:var(--need-bg);color:var(--need);border-color:var(--need)}
.toast button{margin-left:12px;border:0;background:transparent;color:var(--accent);font:800 15px var(--body);padding:4px 6px;text-decoration:underline}
#ins-print{display:none}
.hint{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* drag */
.page .pk{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pk img{pointer-events:none;-webkit-user-drag:none}
.pk.pressing{transform:scale(.94);transition:transform .25s ease}
.pk.lifted{opacity:.2}
.pk.ghost{position:fixed;z-index:80;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.45);border-radius:6px;opacity:.95}
.pk.drop-target{outline:3px solid var(--accent);outline-offset:-1px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
body.dragging,body.dragging *{cursor:grabbing!important}
.pk.just-dropped{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.15)}100%{transform:scale(1)}}
/* inserts */
.btile.tool{grid-template-columns:auto 1fr auto}
.ticon{width:36px;height:50px;border-radius:5px;background:var(--foil);display:grid;place-items:center;font-size:18px;color:#1b2a30}
.ins-top{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ins-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;max-width:520px;width:100%;align-self:center}
.ins-slot{aspect-ratio:5/7;border:1px dashed #b8c2c9;border-radius:4px;background:#f3f5f6;padding:0;overflow:hidden;display:grid;place-items:center;color:#8a97a0;font-size:28px}
.ins-slot:not(.empty){border-style:solid;border-color:#d0d7dc}
.ins-slot canvas{width:100%;height:100%;display:block}
.ins-edit{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:16px;align-items:start}
@media(max-width:600px){.ins-edit{grid-template-columns:1fr}.ins-canvas-wrap{position:sticky;top:-16px;z-index:3;background:var(--bg);padding:6px 0 8px;margin:-6px 0 0}.ins-edit .ins-canvas-wrap canvas{width:min(42vw,170px)}}
.ins-canvas-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ins-canvas-wrap canvas{width:min(100%,240px);aspect-ratio:5/7;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);touch-action:none;cursor:grab;background:var(--sunk)}
.ins-controls{display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto}
.chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:6px 10px;border-radius:999px;min-height:34px}
.chips button i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));box-shadow:0 6px 20px rgba(0,0,0,.25);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

/* ---------- sleeving guide ---------- */
.gpages{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.gpage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;break-inside:avoid;page-break-inside:avoid}
.gpage h3{font-size:18px;display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.gpage h3 small{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px}
.gcell{border:1px solid var(--line);border-radius:6px;padding:4px;font-size:10.5px;line-height:1.2;min-height:64px;display:flex;flex-direction:column;gap:2px;position:relative;overflow-wrap:anywhere}
.gcell .gimg{height:62px;display:flex;justify-content:center;margin-bottom:2px}
.gcell .gimg img{height:100%;border-radius:3px}
.gcell b{font-size:11.5px}
.gcell .n{font-family:var(--mono);font-size:10px}
.gcell .tick{position:absolute;top:3px;right:3px;width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px;background:var(--surface)}
.gcell.leave{border-style:dashed;background:var(--bg);color:var(--muted)}
.gcell.leave b{color:var(--need)}
.gcell.unused{border-color:transparent;background:var(--bg);color:var(--line);justify-content:center;align-items:center}
.gcell.full{grid-column:1/-1;min-height:90px;justify-content:center;align-items:center;text-align:center;font-size:14px}
.gsec-h{grid-column:1/-1;margin:8px 0 0;color:var(--need)}
.printhead{display:none}

@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr;gap:6px}
  .stats .stat:first-child{grid-column:1/-1}
  .stat b{font-size:22px}
  .sec{flex-wrap:wrap}
  .sec .acts{width:100%;justify-content:flex-start;padding-left:20px}
  .detail .dimg{width:110px}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f2f2f2;--fg:#000;--muted:#444;--line:#bbb;--need:#9a3412}
  body{background:#fff;color:#000;font-size:11px}
  .wrap{padding:0;max-width:none;gap:0}
  header,.tabs,.banner,.fab,.no-print,.toast,#modal-root{display:none!important}
  body.print-ins .wrap{display:none!important}
  body.print-ins #ins-print{display:block}
  .ins-page{position:relative;width:8.5in;height:11in;overflow:hidden;page-break-after:avoid;break-after:avoid}
  .ins-grid{position:absolute;left:0.5in;top:0.25in;width:7.5in;height:10.5in;display:grid;grid-template-columns:repeat(3,2.5in);grid-template-rows:repeat(3,3.5in)}
  .ins-grid img{width:2.5in;height:3.5in;display:block;outline:0.5px dashed #9aa3ab;outline-offset:-0.25px}
  .tick{position:absolute;background:#000}
  .tick.v{width:0.5px;height:0.2in}
  .tick.h{height:0.5px;width:0.4in}
  .printhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .printhead h1{font-size:20px;margin:0}
  .printhead div{font-size:11px;color:#333;text-align:right}
  .gpages{display:block}
  .gpage{border:1px solid #999;margin-bottom:10px;border-radius:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="foil"></div>
    <div class="hrow"><button class="back" id="back" hidden>‹ My binders</button><button class="acct" id="acct"></button><button class="theme" id="theme" aria-label="Switch light or dark mode"></button></div>
    <h1 id="title">Binder Blueprint</h1>
    <p class="sub" id="sub">Plan your real binder before you sleeve a single card.</p>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#binder" data-tab="binder">Binder</a>
    <a href="#contents" data-tab="contents">Contents</a>
    <a href="#guide" data-tab="guide">Print</a>
    <a href="#setup" data-tab="setup">Setup</a>
  </nav>
  <div class="banner" id="banner"></div>
  <main id="main"></main>
</div>
<button class="fab" id="fab">＋ Add</button>
<div id="modal-root"></div>
<div id="ins-print"></div>
<style id="pagestyle"></style>

<script>
/* =========================================================
   Binder Blueprint — Phase 1
   One binder = one ordered list of items. Pages are calculated.
   ========================================================= */
const API = 'https://api.tcgdex.net/v2/en';
const LS_KEY = 'binderBlueprint.v1';
const GRID = {4:[2,2], 9:[3,3], 12:[3,4]};          // pockets -> [cols, rows]
const TITLE_COLORS = ['#F2B705','#3A86FF','#E63946','#2A9D8F','#8E5CF7','#FF7AB6','#FF8C42','#2B2D42','#8D99AE'];
const ENERGY = [['Grass','#4FAF5A'],['Fire','#EE5A2F'],['Water','#2F8FD8'],['Lightning','#E9B90C'],['Psychic','#9B4FB5'],['Fighting','#B5652F'],['Darkness','#3B3F4A'],['Metal','#8A95A3'],['Fairy','#E58BBE']];
const ENERGY_COLOR = Object.fromEntries(ENERGY);

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------------- storage ---------------- */
function newBinder(name, pockets = 9, pages = 20) {
  return { id: uid(), name, pockets, pages, spreads: true, items: [], sections: {}, created: Date.now() };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && Array.isArray(d.binders)) return d;
  } catch (e) {}
  return { binders: [], members: [], cur: null, tapMode: 'details', zoom: 1, showAll: false, guide: { pics: true, skipBlank: true } };
}
let store = load();
let storageOK = true;
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch (e) { if (storageOK) { storageOK = false; renderBanner(); } }
}
function save() { saveLocal(); if (typeof Sync !== 'undefined') Sync.schedule(); }
const cur = () => store.binders.find(b => b.id === store.cur) || null;

/* ---------------- layout engine ----------------
   Walks the item list once and gives every item a pocket position.
   side index s: 0 = first page (a right-hand page when the binder opens in spreads),
   odd sides are left pages, even sides are right pages. */
function layout(b, items = b.items) {
  const P = b.pockets;
  let pos = 0;
  const at = new Array(items.length).fill(-1);
  const fullSides = {};
  const fresh = to => {
    if (pos % P) pos = Math.ceil(pos / P) * P;
    if (to === 'spread' && b.spreads && (pos / P) % 2 === 0) pos += P;   // jump to next left page
  };
  items.forEach((it, i) => {
    if (it.k === 'break') { fresh(it.to); return; }
    if (it.k === 'title' && it.size === 'page') { fresh('page'); at[i] = pos; fullSides[pos / P] = i; pos += P; return; }
    at[i] = pos++;
  });
  const cap = b.pages * 2 * P;
  return { at, used: pos, cap, P, fullSides, usedSides: Math.ceil(pos / P), capSides: b.pages * 2 };
}
function bySide(L) {
  const m = {};
  L.at.forEach((p, i) => { if (p < 0) return; const s = Math.floor(p / L.P); (m[s] ??= {})[p % L.P] = i; });
  return m;
}
function sideWords(b, s) {
  const sheet = Math.floor(s / 2) + 1, face = s % 2 ? 'back' : 'front';
  const lr = b.spreads ? (s % 2 ? 'left page' : 'right page') : '';
  return { label: `Page ${s + 1}`, lr, sheet: `binder page ${sheet}, ${face}` };
}
/* How would the binder look with these extra items? */
function fitAdvice(b, L) {
  if (L.used <= L.cap) return null;
  const needSides = L.usedSides, extraSheets = Math.ceil((needSides - L.capSides) / 2);
  const bigger = [9, 12].filter(p => p > b.pockets).find(p => layout({ ...b, pockets: p }).used <= b.pages * 2 * p);
  return { needSides, extraSheets, bigger };
}
function adviceText(b, a) {
  let t = `Add ${plural(a.extraSheets, 'more binder page')} (you have ${b.pages})`;
  if (a.bigger) t += `, or switch to a ${a.bigger}-pocket binder`;
  return t + '.';
}

/* ---------------- sections ---------------- */
function sectionOrder(b) {
  const seen = new Set(), out = [];
  b.items.forEach(it => { if (!seen.has(it.sec)) { seen.add(it.sec); out.push(it.sec); } });
  return out;
}
function secStats(b, L, sec) {
  let cards = 0, own = 0, pockets = 0, first = Infinity, last = -1, color = null;
  b.items.forEach((it, i) => {
    if (it.sec !== sec) return;
    if (it.k === 'card') { cards++; if (it.own) own++; }
    if (it.k === 'title' && !color) color = it.color;
    const p = L.at[i]; if (p < 0) return;
    pockets += (it.k === 'title' && it.size === 'page') ? L.P : 1;
    first = Math.min(first, p); last = Math.max(last, p + ((it.k === 'title' && it.size === 'page') ? L.P - 1 : 0));
  });
  return { cards, own, pockets, firstSide: first === Infinity ? null : Math.floor(first / L.P), lastSide: last < 0 ? null : Math.floor(last / L.P), color, over: last >= L.cap };
}

/* ---------------- card data (TCGdex, with offline demo) ---------------- */
let demoMode = false;
let setsCache = null;
const setCache = {};
async function getJSON(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const DEMO_SETS = [
  { id: 'demo-meadow', name: 'Demo Set · Meadow', official: 36, total: 40 },
  { id: 'demo-volcano', name: 'Demo Set · Volcano', official: 98, total: 110 },
  { id: 'demo-ocean', name: 'Demo Set · Deep Sea', official: 151, total: 165 },
  { id: 'demo-sky', name: 'Demo Set · Sky Trainers', official: 24, total: 24 },
];
const DEMO_WORDS = ['Sprout','Ember','Ripple','Spark','Pebble','Gust','Shade','Bloom','Frost','Glimmer','Thorn','Cinder','Tide','Bolt','Moss','Drift'];
function demoCards(set) {
  return Array.from({ length: set.total }, (_, i) => {
    const n = String(i + 1).padStart(3, '0');
    return { cid: `${set.id}-${n}`, num: n, name: `${DEMO_WORDS[i % DEMO_WORDS.length]} ${set.name.split('· ')[1].split(' ')[0]}`, img: null, set: set.id, setName: set.name };
  });
}
async function getSets() {
  if (setsCache) return setsCache;
  try {
    const raw = await getJSON(`${API}/sets`);
    // Skip TCG Pocket sets (A1, A2b, B1, P-A…): they're digital-only and can't go in a real binder.
    setsCache = raw.filter(s => s.cardCount && s.cardCount.total > 0 && !/^(A|B)\d+[a-z]?$|^P-[A-Z]$/.test(s.id))
      .map(s => ({ id: s.id, name: s.name, total: s.cardCount.total, official: s.cardCount.official || s.cardCount.total }))
      .reverse();
  } catch (e) {
    demoMode = true;
    setsCache = DEMO_SETS;
  }
  return setsCache;
}
async function getSet(id) {
  if (setCache[id]) return setCache[id];
  const sets = await getSets();
  const meta = sets.find(s => s.id === id) || { id, name: id, total: 0, official: 0 };
  if (demoMode) return (setCache[id] = { ...meta, cards: demoCards(meta) });
  const d = await getJSON(`${API}/sets/${encodeURIComponent(id)}`);
  const cards = (d.cards || []).map(c => briefToCard(c, id, d.name));
  return (setCache[id] = { id, name: d.name, official: d.cardCount?.official || cards.length, total: cards.length, cards });
}
function briefToCard(c, setId, setName) {
  return { cid: c.id, num: c.localId, name: c.name, img: c.image ? c.image + '/low.webp' : null, set: setId, setName };
}
async function searchCards(q) {
  const sets = await getSets();
  if (demoMode) {
    const out = [];
    for (const s of sets) out.push(...demoCards(s).filter(c => c.name.toLowerCase().includes(q.toLowerCase())));
    return out.slice(0, 150);
  }
  const raw = await getJSON(`${API}/cards?name=${encodeURIComponent(q)}`);
  const rank = Object.fromEntries(sets.map((s, i) => [s.id, i]));   // sets are newest first
  return raw.map(c => ({ c, setId: c.id.slice(0, c.id.lastIndexOf('-')) }))
    .filter(x => x.setId in rank)
    .sort((a, b) => rank[a.setId] - rank[b.setId])
    .slice(0, 150)
    .map(x => briefToCard(x.c, x.setId, sets[rank[x.setId]].name));
}

/* ---------------- pockets ---------------- */
function cardFace(it) {
  // The text placeholder shows only when there's no picture, or the picture fails to load.
  return `<div class="ph${it.img ? ' under' : ''}"><b>#${esc(it.num)}</b><span>${esc(it.name)}</span></div>` +
    (it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('broken');this.remove()">` : '');
}
function pocketHTML(b, i, over) {
  const it = b.items[i];
  const o = over ? ' over-pk' : '';
  if (it.k === 'card')
    return `<button class="pk ${it.own ? 'own' : 'need'}${o}" data-i="${i}" title="#${esc(it.num)} ${esc(it.name)}">${cardFace(it)}<span class="tag">${it.own ? '✓' : '#' + esc(it.num)}</span></button>`;
  if (it.k === 'empty') return `<button class="pk empty${o}" data-i="${i}" title="Empty pocket"></button>`;
  if (it.k === 'energy') return `<button class="pk energy${o}" data-i="${i}" style="background:${ENERGY_COLOR[it.type]}"><span class="orb"></span>${esc(it.type)}</button>`;
  if (it.k === 'title') return `<button class="pk title${o}" data-i="${i}" style="background:${esc(it.color)}">${esc(it.text || 'Title')}</button>`;
  return '';
}
function pageHTML(b, L, map, s) {
  const [cols] = GRID[b.pockets];
  const over = s >= L.capSides;
  const w = sideWords(b, s);
  let inner = '';
  if (L.fullSides[s] !== undefined) {
    const it = b.items[L.fullSides[s]];
    inner = `<button class="pk titlepage" data-i="${L.fullSides[s]}" style="background:${esc(it.color)}">${esc(it.text || 'Title page')}</button>`;
  } else {
    const row = map[s] || {};
    for (let k = 0; k < b.pockets; k++) inner += row[k] !== undefined ? pocketHTML(b, row[k], over) : `<div class="pk blank"></div>`;
  }
  return `<div class="page${over ? ' over' : ''}" data-side="${s}" style="--cols:${cols}">${inner}<div class="pno">${over ? "doesn't fit · " : ''}p.${s + 1}</div></div>`;
}

/* ---------------- views ---------------- */
const TABS = ['binder', 'contents', 'guide', 'setup'];
const okTab = t => t === 'home' || t === 'inserts' || (TABS.includes(t) && !!cur());
let tab = (location.hash || '#home').slice(1);
if (!okTab(tab)) tab = 'home';
/* Navigation uses browser history so the phone's back gesture works:
   back closes an open window first, then goes from a binder to My binders. */
let closingModal = false, afterPop = null;
function go(t) {
  if (closingModal) { afterPop = () => go(t); return; }
  const st = history.state || {};
  if (t === 'home') {
    if (st.inBinder) { history.back(); return; }          // popstate renders home
    history.replaceState(null, '', '#home');
  } else if (tab === 'home') history.pushState({ inBinder: 1 }, '', '#' + t);
  else history.replaceState({ inBinder: st.inBinder || 0 }, '', '#' + t);
  tab = t; render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => {
  if (closingModal) { closingModal = false; const f = afterPop; afterPop = null; if (f) f(); return; }
  if ($('#modal-root').innerHTML) { $('#modal-root').innerHTML = ''; return; }
  const t = location.hash.slice(1) || 'home';
  tab = okTab(t) ? t : 'home';
  render(); window.scrollTo(0, 0);
});
function toggleOwn(i) {
  const b = cur(), it = b.items[i]; if (!it || it.k !== 'card') return;
  it.own = !it.own; save();
  const el = tab === 'binder' && $(`#main .pk[data-i="${i}"]`);
  if (!el) return render();
  // Patch just this pocket and the counts, so pictures don't reload.
  el.classList.toggle('own', it.own); el.classList.toggle('need', !it.own);
  el.querySelector('.tag').textContent = it.own ? '✓' : '#' + it.num;
  const st = $('#main .stats');
  if (st) { const tmp = document.createElement('div'); tmp.innerHTML = statsHTML(b, layout(b)); st.replaceWith(tmp.querySelector('.stats')); }
}

function render() {
  const b = cur();
  if (!okTab(tab)) tab = 'home';
  const home = tab === 'home', insv = tab === 'inserts';
  $('#tabs').hidden = home || insv;
  $('#back').hidden = home;
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  $('#title').textContent = home ? 'Binder Blueprint' : insv ? 'Title & divider cards' : b.name;
  $('#sub').textContent = home ? 'Plan your real binder before you sleeve a single card.' : insv ? 'Make your own inserts at real card size.' : `${b.pockets}-pocket binder · ${b.pages} pages`;
  $('#fab').style.display = !home && !insv && b.items.length && (tab === 'binder' || tab === 'contents') ? '' : 'none';
  document.documentElement.style.setProperty('--zoom', store.zoom);
  ({ home: renderHome, inserts: renderInserts, binder: renderBinder, contents: renderContents, guide: renderGuide, setup: renderSetup })[tab]();
}
function renderHome() {
  const steps = `<div class="steps"><div><i>1</i>Pick your binder</div><div><i>2</i>Add your cards</div><div><i>3</i>Print &amp; sleeve</div></div>`;
  if (!store.binders.length) {
    $('#main').innerHTML = `<div class="hero"><button class="btn primary" data-act="create">＋ Create a binder</button>${steps}</div>
      <button class="btile tool" data-act="inserts"><span class="ticon">✂︎</span><span><b>Title &amp; divider cards</b><span class="small muted">Make your own inserts and print them at card size</span></span><span class="go">›</span></button>
      <p class="foot">Card data and pictures from <a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a>. Not connected to any card game company.</p>`;
    return;
  }
  const ms = store.members || [];
  if (store.who && !ms.some(x => x.id === store.who)) store.who = '';
  const list = store.binders.filter(x => !store.who || x.member === store.who);
  const chips = ms.length ? `<div class="chips chiprow"><button data-who="" class="${!store.who ? 'on' : ''}">Everyone</button>${ms.map(x => `<button data-who="${x.id}" class="${store.who === x.id ? 'on' : ''}">${esc(x.name)}</button>`).join('')}<button data-act="family">✎ Family</button></div>` : '';

function renderBinder() {
  const b = cur(), L = layout(b), map = bySide(L);

    return;
  }
  const lastUsed = Math.max(L.usedSides, 1);
  const showTo = store.showAll ? Math.max(L.capSides, L.usedSides) : Math.min(Math.max(lastUsed + (b.spreads && lastUsed % 2 === 0 ? 1 : 0), Math.min(2, L.capSides)), Math.max(L.capSides, lastUsed));
  const total = Math.max(showTo, 1);

    for (const [l, r] of groups) {
      const label = l < 0 ? 'Page 1' : (r < total ? `Pages ${l + 1}–${r + 1}` : `Page ${l + 1}`);
      const left = l < 0 ? `<div class="page cover" style="--cols:1">inside<br>front cover</div>` : pageHTML(b, L, map, l);
      const right = r < total ? pageHTML(b, L, map, r) : `<div class="page cover" style="--cols:1">inside<br>back cover</div>`;

  else if (store.showAll && L.capSides > lastUsed + 1) html += `<div class="more-pages"><button class="btn sm" data-act="showless">Hide empty pages</button></div>`;

}

/* ---------------- modal helpers ---------------- */
function openModal(html, wide) {
  if (!$('#modal-root').innerHTML) history.pushState({ ...(history.state || {}), modal: 1 }, '', location.href);
  $('#modal-root').innerHTML = `<div class="scrim"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $('#modal-root .scrim');
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) closeModal(); });
  return $('#modal-root .modal');
}
function closeModal() {
  if (!$('#modal-root').innerHTML) return;
  $('#modal-root').innerHTML = '';
  if (history.state && history.state.modal) { closingModal = true; history.back(); }
}
function confirmBox(title, msg, okLabel, fn) {
  const m = openModal(`<div class="mhead"><h2>${title}</h2></div><p>${msg}</p><div class="mfoot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="cOK">${okLabel}</button></div>`);
  $('#cOK', m).onclick = () => { closeModal(); fn(); };
}
let toastT;
function toast(msg, action) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  if (action) {
    const b = document.createElement('button'); b.textContent = action.label;
    b.onclick = () => { t.remove(); action.fn(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), action ? 5000 : 2000);
}
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ---------------- add dialog ---------------- */
const ADD_TABS = [['set', 'Whole set'], ['range', 'Card range'], ['pick', 'Pick cards'], ['energy', 'Energy'], ['title', 'Title / divider'], ['empty', 'Empty pockets']];
const A = { tab: 'set', build: null };

function openAdd(beforeSec) {
  const b = cur(), secs = sectionOrder(b);
  const m = openModal(`
    <div class="mhead"><h2>Add to your binder</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="seg addtabs">${ADD_TABS.map(([k, l]) => `<button data-at="${k}" class="${k === A.tab ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div id="addBody"></div>
    <div class="where">
      <label>Put it <select class="inp" id="aPos"><option value="end">at the end</option>${secs.map(s => `<option value="${s}" ${s === beforeSec ? 'selected' : ''}>before “${esc((b.sections[s] || {}).label || 'Cards')}”</option>`).join('')}</select></label>
      <label>Start it on <select class="inp" id="aStart"><option value="here">the next free pocket</option><option value="page">a fresh page</option>${b.spreads ? '<option value="spread">a fresh spread (left page)</option>' : ''}</select></label>
    </div>
    <div id="addPreview" class="preview">Pick something to add.</div>
    <div class="mfoot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="addGo" disabled>Add to binder</button></div>`, true);
  $$('[data-at]', m).forEach(btn => btn.onclick = () => { A.tab = btn.dataset.at; $$('[data-at]', m).forEach(x => x.classList.toggle('on', x === btn)); showAddTab(); });
  $('#aPos', m).onchange = refreshPreview;
  $('#aStart', m).onchange = refreshPreview;
  $('#addGo', m).onclick = doAdd;
  showAddTab();
}
function insertIndex(b, pos) {
  if (pos === 'end') return b.items.length;
  const i = b.items.findIndex(it => it.sec === pos);
  return i < 0 ? b.items.length : i;
}
function pendingItems() {
  const r = A.build && A.build();
  if (!r || !r.items.length) return null;
  const start = $('#aStart').value;
  return { label: r.label, items: (start !== 'here' ? [{ k: 'break', to: start }] : []).concat(r.items) };
}
function refreshPreview() {
  const box = $('#addPreview'), go = $('#addGo'); if (!box) return;
  const r = pendingItems();
  if (!r) { box.className = 'preview'; box.textContent = 'Pick something to add.'; go.disabled = true; return; }
  const b = cur(), idx = insertIndex(b, $('#aPos').value);
  const items = [...b.items.slice(0, idx), ...r.items.map(x => ({ ...x, _new: 1 })), ...b.items.slice(idx)];
  const L = layout(b, items), before = layout(b);
  let first = Infinity, last = -1;
  items.forEach((it, i) => { if (it._new && L.at[i] >= 0) { first = Math.min(first, L.at[i]); last = Math.max(last, L.at[i] + (it.k === 'title' && it.size === 'page' ? L.P - 1 : 0)); } });
  const fs = Math.floor(first / L.P) + 1, ls = Math.floor(last / L.P) + 1;
  const pockets = r.items.filter(x => x.k !== 'break').reduce((n, x) => n + (x.k === 'title' && x.size === 'page' ? L.P : 1), 0);
  const sidesLeft = Math.max(0, L.capSides - before.usedSides);
  const where = fs === ls ? `page ${fs}` : `pages ${fs}–${ls}`;
  const moved = idx < b.items.length ? ' Everything after it moves along.' : '';
  if (L.used > L.cap) {
    const a = fitAdvice(b, L);
    box.className = 'preview bad';
    box.innerHTML = `⚠️ <b>${esc(r.label)} won't all fit.</b> It needs ${plural(ls - fs + 1, 'page side')} (${where}) and you have ${plural(sidesLeft, 'side')} left. ${adviceText(b, a)} You can still add it and fix it later.`;
  } else {
    box.className = 'preview';
    box.innerHTML = `✓ <b>${esc(r.label)}</b>: ${plural(pockets, 'pocket')}, on ${where}.${moved}`;
  }
  go.disabled = false;
  go.textContent = L.used > L.cap ? 'Add anyway' : 'Add to binder';
}
function doAdd() {
  const r = pendingItems(); if (!r) return;
  const b = cur(), sec = uid(), idx = insertIndex(b, $('#aPos').value);
  b.sections[sec] = { label: r.label };
  b.items.splice(idx, 0, ...r.items.map(x => ({ ...x, sec })));
  closeModal();
  if (tab !== 'contents' && tab !== 'binder') { save(); toast(`Added ${r.label}`); return go('binder'); }
  commit(`Added ${r.label}`);
}

async function setPicker(el, onPick) {
  el.innerHTML = `<input class="inp" placeholder="Search sets…" aria-label="Search sets"><div class="setlist"><div class="muted small" style="padding:8px">Loading sets…</div></div>`;
  const inp = $('input', el), list = $('.setlist', el);
  const sets = await getSets();
  if (demoMode) list.insertAdjacentHTML('beforebegin', `<p class="small muted" style="margin:0">Preview: made-up demo sets. Real sets and pictures load on your own site.</p>`);
  let picked = null;
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const f = sets.filter(s => !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)).slice(0, 120);
    list.innerHTML = f.map(s => `<button data-sid="${esc(s.id)}" class="${s.id === picked ? 'on' : ''}"><b>${esc(s.name)}</b><span>${s.total} cards</span></button>`).join('') || '<div class="muted small" style="padding:8px">No sets match.</div>';
  };
  inp.oninput = draw; draw();
  list.onclick = e => {
    const btn = e.target.closest('[data-sid]'); if (!btn) return;
    picked = btn.dataset.sid; draw();
    onPick(sets.find(s => s.id === picked));
  };
}

/* ---------------- item detail ---------------- */
function moveItem(i, d) {
  const b = cur(), j = i + d; if (j < 0 || j >= b.items.length) return i;
  const a = b.items[i], c = b.items[j];
  [a.sec, c.sec] = [c.sec, a.sec];          // keep sections in one block
  b.items[i] = c; b.items[j] = a;
  return j;
}
function openItem(i) {
  const b = cur(), it = b.items[i]; if (!it) return;
  const L = layout(b), p = L.at[i], s = Math.floor(p / L.P), w = sideWords(b, s);
  const spot = `${w.label}${w.lr ? ' (' + w.lr + ')' : ''}, pocket ${p % L.P + 1}`;
  let top = '';
  if (it.k === 'card') top = `<div class="detail"><div class="dimg"><div class="pk own">${cardFace(it)}</div></div><div class="grow">
      <h2>${esc(it.name)}</h2><p class="muted" style="margin:4px 0 12px">${esc(it.setName || '')} · #${esc(it.num)}<br>${spot}</p>
      <div class="seg hn" id="dOwn" role="group" aria-label="Do you have this card?"><button class="${it.own ? 'on have' : ''}" data-own="1">✓ Have it</button><button class="${it.own ? '' : 'on need'}" data-own="0">Need it</button></div>
      <p class="small muted">${it.own ? 'It goes in this pocket when you sleeve.' : 'Its pocket stays empty until you get it.'}</p></div></div>`;
  else if (it.k === 'title') top = `<h2 style="margin-bottom:10px">Title / divider</h2><p class="muted small">${spot}</p>
      <label class="field"><span>Text</span><input class="inp" id="dText" maxlength="40" value="${esc(it.text)}"></label>
      <div class="field"><span>Color</span><div class="swatches">${TITLE_COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c === it.color ? 'on' : ''}" aria-label="color"></button>`).join('')}</div></div>
      <div class="field"><span>Size</span><div class="seg" id="dSize"><button data-s="pocket" class="${it.size !== 'page' ? 'on' : ''}">One pocket</button><button data-s="page" class="${it.size === 'page' ? 'on' : ''}">A whole page</button></div></div>
      <button class="btn sm" id="dIns">✂︎ Make a printable card for this</button>`;
  else if (it.k === 'energy') top = `<h2>${esc(it.type)} Energy</h2><p class="muted small">${spot}</p>`;
  else top = `<h2>Empty pocket</h2><p class="muted small">${spot}. Saved for later.</p>`;
  const m = openModal(`<div class="mhead"><span style="flex:1"></span><button class="icon-btn" data-close aria-label="Close">✕</button></div>${top}
    <div class="drow"><button class="btn sm" id="dPrev">◀ Move earlier</button><button class="btn sm" id="dNext">Move later ▶</button></div>
    <div class="drow"><button class="btn sm" id="dEmpty">＋ Empty pocket before this</button><button class="btn sm danger" id="dDel">Remove</button></div>`);
  $$('#dOwn button', m).forEach(btn => btn.onclick = () => { if (!!+btn.dataset.own !== !!it.own) toggleOwn(i); openItem(i); });
  $('#dText', m) && ($('#dText', m).oninput = e => { it.text = e.target.value; save(); render(); });
  $$('.swatches button', m).forEach(btn => btn.onclick = () => { it.color = btn.dataset.c; commit(); openItem(i); });
  $$('#dSize button', m).forEach(btn => btn.onclick = () => { it.size = btn.dataset.s; commit(); openItem(i); });
  $('#dPrev', m).onclick = () => { const j = moveItem(i, -1); commit(); openItem(j); };
  $('#dNext', m).onclick = () => { const j = moveItem(i, 1); commit(); openItem(j); };
  $('#dEmpty', m).onclick = () => { b.items.splice(i, 0, { k: 'empty', sec: it.sec }); commit('Empty pocket added'); openItem(i + 1); };
  $('#dIns', m) && ($('#dIns', m).onclick = () => titleToInsert(it));
  $('#dDel', m).onclick = () => { const [gone] = b.items.splice(i, 1); closeModal(); commit(); toast('Removed', { label: 'Undo', fn: () => { b.items.splice(i, 0, gone); commit(); } }); };
}

/* ---------------- drag to rearrange ----------------
   Touch: hold a card still for a moment, then drag. Moving early is a normal scroll.
   Mouse: press and drag a few pixels. Drop on any pocket to put the card there. */
const DRAG = { el: null, i: -1, id: null, type: '', x0: 0, y0: 0, x: 0, y: 0, timer: 0, active: false, ghost: null, target: null, raf: 0, justDropped: false };
const HOLD_MS = 260;

function dragReset() {
  clearTimeout(DRAG.timer);
  cancelAnimationFrame(DRAG.raf);
  DRAG.ghost?.remove();
  DRAG.el?.classList.remove('lifted', 'pressing');
  $$('.drop-target').forEach(x => x.classList.remove('drop-target'));
  document.body.classList.remove('dragging');
  Object.assign(DRAG, { el: null, i: -1, id: null, active: false, ghost: null, target: null });
}
function dragLift() {
  const el = DRAG.el; if (!el) return;
  DRAG.active = true;
  el.classList.remove('pressing');
  const r = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.className = el.className + ' ghost'; g.removeAttribute('data-i');
  Object.assign(g.style, { width: r.width + 'px', height: r.height + 'px', left: '0px', top: '0px' });
  DRAG.dx = DRAG.x - r.left; DRAG.dy = DRAG.y - r.top;
  document.body.appendChild(g); DRAG.ghost = g;
  el.classList.add('lifted');
  document.body.classList.add('dragging');
  try { navigator.vibrate?.(12); } catch (e) {}
  dragMoveGhost(); dragLoop();
}
function dragMoveGhost() {
  if (!DRAG.ghost) return;
  DRAG.ghost.style.transform = `translate(${DRAG.x - DRAG.dx}px, ${DRAG.y - DRAG.dy}px) rotate(-3deg) scale(1.08)`;
  const under = document.elementFromPoint(DRAG.x, DRAG.y);
  const t = under && under.closest('.page .pk');
  if (t !== DRAG.target) {
    DRAG.target?.classList.remove('drop-target');
    DRAG.target = t && t !== DRAG.el ? t : null;
    DRAG.target?.classList.add('drop-target');
  }
}
function dragLoop() {   // scroll the page when the finger is near the top or bottom edge
  if (!DRAG.active) return;
  const edge = 80, h = innerHeight;
  let v = 0;
  if (DRAG.y < edge) v = -Math.ceil((edge - DRAG.y) / 6);
  else if (DRAG.y > h - edge) v = Math.ceil((DRAG.y - (h - edge)) / 6);
  if (v) { window.scrollBy(0, v); dragMoveGhost(); }
  DRAG.raf = requestAnimationFrame(dragLoop);
}
/* Where does the dragged item land? Returns the index to insert at (after removing it). */
function dropIndex(b, from, target) {
  const L = layout(b);
  if (target.dataset.i !== undefined) return { at: +target.dataset.i, sec: b.items[+target.dataset.i].sec, before: true };
  // A blank pocket: put it right after the last item placed before that pocket.
  const page = target.closest('.page'), pageIdx = +page.dataset.side, k = [...page.querySelectorAll('.pk')].indexOf(target);
  const pos = pageIdx * L.P + k;
  let best = -1, bestPos = -1;
  b.items.forEach((it, i) => { if (L.at[i] >= 0 && L.at[i] < pos && L.at[i] > bestPos) { bestPos = L.at[i]; best = i; } });
  return { at: best + 1, sec: best >= 0 ? b.items[best].sec : b.items[0].sec, before: false };
}
function dragDrop() {
  const b = cur(), from = DRAG.i, target = DRAG.target;
  if (!b || !target || from < 0) return;
  const snapshot = JSON.stringify({ items: b.items, sections: b.sections });
  const d = dropIndex(b, from, target);
  const [it] = b.items.splice(from, 1);
  let at = d.at;
  if (!d.before && from < at) at--;          // removing the card shifted everything after it
  if (at === from && d.before) { b.items.splice(from, 0, it); return; }
  it.sec = d.sec;
  b.items.splice(Math.max(0, Math.min(at, b.items.length)), 0, it);
  save(); render();
  const moved = b.items.indexOf(it);
  $(`#main .pk[data-i="${moved}"]`)?.classList.add('just-dropped');
  toast(it.k === 'card' ? `Moved ${it.name}` : 'Moved', { label: 'Undo', fn: () => { const s = JSON.parse(snapshot); b.items = s.items; b.sections = s.sections; commit('Move undone'); } });
}

$('#main').addEventListener('pointerdown', e => {
  if (tab !== 'binder' || e.button > 0 || DRAG.el) return;
  const el = e.target.closest('.page .pk[data-i]'); if (!el) return;
  Object.assign(DRAG, { el, i: +el.dataset.i, id: e.pointerId, type: e.pointerType, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY });
  if (e.pointerType !== 'mouse') {
    el.classList.add('pressing');
    DRAG.timer = setTimeout(dragLift, HOLD_MS);
  }
});
document.addEventListener('pointermove', e => {
  if (!DRAG.el || e.pointerId !== DRAG.id) return;
  DRAG.x = e.clientX; DRAG.y = e.clientY;
  const moved = Math.hypot(DRAG.x - DRAG.x0, DRAG.y - DRAG.y0);
  if (!DRAG.active) {
    if (DRAG.type === 'mouse') { if (moved > 6) dragLift(); }
    else if (moved > 10) dragReset();          // finger moved before the hold: it's a scroll
    return;
  }
  e.preventDefault();
  dragMoveGhost();
});
document.addEventListener('pointerup', e => {
  if (!DRAG.el || e.pointerId !== DRAG.id) return;
  if (DRAG.active) { DRAG.justDropped = true; setTimeout(() => DRAG.justDropped = false, 60); dragDrop(); }
  dragReset();
});
document.addEventListener('pointercancel', e => { if (DRAG.el && e.pointerId === DRAG.id) dragReset(); });
// While a card is lifted, stop the page from scrolling under the finger.
document.addEventListener('touchmove', e => { if (DRAG.active) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('.page .pk')) e.preventDefault(); });

/* ---------------- insert maker ----------------
   Title / divider cards at real card size (2.5 × 3.5 in), 9 to a letter sheet.
   Pictures are the person's own uploads only. Settings live in localStorage,
   pictures in IndexedDB (they're too big for localStorage). */
const INS_KEY = 'binderBlueprint.inserts';
const CARD_W = 750, CARD_H = 1050;               // 300 dpi
// Border colors we picked for each set (our own choices, no logos).
const SET_BORDERS = [
  ['30th Celebration', '#F2C230'], ['Chaos Rising', '#2F6FDB'], ['Delta Reign', '#7A4FD6'], ['Pitch Black', '#23262D'],
  ['Perfect Order', '#C9CED6'], ['Ascended Heroes', '#E39B2D'], ['Phantasmal Flames', '#E2552B'], ['Mega Evolution', '#2FA4C8'],
  ['White Flare', '#EDEDED'], ['Black Bolt', '#1B1B1B'], ['Destined Rivals', '#B0233A'], ['Journey Together', '#3BAA6E'],
  ['Prismatic Evolutions', '#B57BFF'], ['Surging Sparks', '#F4C21B'], ['151', '#E3350D'],
];
const BG_COLORS = ['#1B2B33', '#2F6FDB', '#E63946', '#2A9D8F', '#8E5CF7', '#F2B705', '#FF7AB6', '#FFFFFF'];
const blankSlot = () => ({ id: uid(), hasImg: false, x: 0, y: 0, z: 1, rot: 0, text: '', textPos: 'bottom', bg: '#1B2B33', border: '' });
let ins = (() => {
  try { const d = JSON.parse(localStorage.getItem(INS_KEY)); if (d && Array.isArray(d.slots) && d.slots.length === 9) return d; } catch (e) {}
  return { slots: Array.from({ length: 9 }, blankSlot) };
})();
const saveInsLocal = () => { try { localStorage.setItem(INS_KEY, JSON.stringify(ins)); } catch (e) {} };
const saveIns = () => { saveInsLocal(); if (typeof Sync !== 'undefined') Sync.schedule(); };

/* tiny IndexedDB store for pictures */
const imgDB = (() => {
  let dbp = null; const mem = {};
  const open = () => dbp ??= new Promise(res => {
    try {
      const r = indexedDB.open('binderBlueprint', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('insertImages');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const tx = async (mode, fn) => { const db = await open(); if (!db) return null; return new Promise(res => { const t = db.transaction('insertImages', mode); const q = fn(t.objectStore('insertImages')); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); }); };
  return {
    get: async k => mem[k] ?? (mem[k] = await tx('readonly', s => s.get(k))),
    set: async (k, v) => { mem[k] = v; await tx('readwrite', s => s.put(v, k)); },
    del: async k => { delete mem[k]; await tx('readwrite', s => s.delete(k)); },
  };
})();
const imgEls = {};
async function slotImage(slot) {
  if (!slot.hasImg) return null;
  if (imgEls[slot.id]) return imgEls[slot.id];

/* Shrink a photo to at most 2000px so it stays light but prints sharp. */
function readPicture(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('not an image'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 2000 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.9));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src = url;
  });
}

/* Draw one insert onto a canvas of any size. */
function drawInsert(ctx, slot, W, H, img) {
  ctx.save();
  ctx.fillStyle = slot.bg || '#1B2B33'; ctx.fillRect(0, 0, W, H);
  if (img) {
    const rot = ((slot.rot % 360) + 360) % 360, side = rot % 180 !== 0;
    const iw = side ? img.height : img.width, ih = side ? img.width : img.height;
    const s = Math.max(W / iw, H / ih) * slot.z;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    ctx.translate(W / 2 + slot.x * W, H / 2 + slot.y * H); ctx.rotate(rot * Math.PI / 180);
    ctx.drawImage(img, -img.width * s / 2, -img.height * s / 2, img.width * s, img.height * s);
    ctx.restore();
  }
  const bw = slot.border ? W * 0.055 : 0;
  if (slot.border) { ctx.lineWidth = bw; ctx.strokeStyle = slot.border; ctx.strokeRect(bw / 2, bw / 2, W - bw, H - bw); }
  const text = (slot.text || '').trim();
  if (text) {
    const maxW = W - bw * 2 - W * 0.12;
    let size = W * 0.13, lines;
    const fam = getComputedStyle(document.documentElement).getPropertyValue('--display') || 'sans-serif';
    for (;;) {   // wrap into at most 3 lines, shrinking until it fits
      ctx.font = `800 ${size}px ${fam}`;
      lines = []; let line = '';
      for (const w of text.split(/\s+/)) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
      lines.push(line);
      if ((lines.length <= 3 && lines.every(l => ctx.measureText(l).width <= maxW)) || size < W * 0.05) break;
      size *= 0.92;
    }
    const lh = size * 1.12, blockH = lines.length * lh;
    const pad = bw + H * 0.05;
    const top = slot.textPos === 'top' ? pad : slot.textPos === 'middle' ? (H - blockH) / 2 : H - pad - blockH;
    let color = luminance(slot.bg || '#000') > 0.6 ? '#15232B' : '#FFFFFF';
    if (img) {
      ctx.fillStyle = 'rgba(10,16,20,.55)';
      ctx.fillRect(bw, top - size * 0.35, W - bw * 2, blockH + size * 0.5);
      color = '#FFFFFF';
    }
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    lines.forEach((l, k) => ctx.fillText(l, W / 2, top + k * lh));
  }
  ctx.restore();
}

   Local first: everything saves on this device instantly, then uploads in the background.
   Each binder is one row (owner, id) with a version number. If another device changed it
   since we last synced, the two are merged: have/need marks are merged card by card, and
   for the order and settings the most recent edit wins (the server keeps a restore point). */

const hashStr = str => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36); };

const structSig = d => hashStr(JSON.stringify([d.items.map(({ own, ...r }) => r), d.sections]));
const settingsSig = d => hashStr(JSON.stringify([d.name, d.pockets, d.pages, d.spreads, d.member || null]));
const ownedList = d => d.items.filter(i => i.k === 'card' && i.own).map(i => i.cid);
const baseOf = d => ({ struct: structSig(d), settings: settingsSig(d), owned: ownedList(d) });
const dataSig = d => hashStr(JSON.stringify(d));

function mergeBinder(local, server, serverAt, base) {
  const L = binderData(local), S = server;
  const localNewer = (local.editedAt || 0) > Date.parse(serverAt || 0);
  const lStruct = structSig(L) !== base.struct, sStruct = structSig(S) !== base.struct;
  const lSet = settingsSig(L) !== base.settings, sSet = settingsSig(S) !== base.settings;
  const st = sStruct && (!lStruct || !localNewer) ? S : L;
  const se = sSet && (!lSet || !localNewer) ? S : L;
  const out = { name: se.name, pockets: se.pockets, pages: se.pages, spreads: se.spreads, member: se.member || null, created: L.created || S.created,
    items: JSON.parse(JSON.stringify(st.items)), sections: JSON.parse(JSON.stringify(st.sections || {})) };
  const was = new Set(base.owned || []), lo = {}, so = {};
  L.items.forEach(i => { if (i.k === 'card') lo[i.cid] = !!i.own; });
  S.items.forEach(i => { if (i.k === 'card') so[i.cid] = !!i.own; });
  out.items.forEach(i => {
    if (i.k !== 'card') return;
    const c = i.cid, lChanged = c in lo && lo[c] !== was.has(c);
    i.own = lChanged ? lo[c] : (c in so ? so[c] : (c in lo ? lo[c] : !!i.own));
  });
  return out;
}
