# Builds the Android app in the cloud, so it can be tried on a phone without setting anything up at home.
# Makes an installable test app (.apk) and posts it at a plain download link:
#   https://github.com/lunde367/binder-blueprint/releases/download/test-build/binder-blueprint-test.apk
# Runs on every change to the app, or from the Actions tab → "Build phone app" → Run workflow.
name: Build phone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'package.json', 'capacitor.config.json', 'scripts/**', 'native/**', 'assets/**', '.github/workflows/app.yml']
permissions: { contents: read }
concurrency: { group: app-build, cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: node scripts/app-web.mjs
      - run: npx cap add android
      - run: npm run assets -- --android
      - run: node scripts/app-setup.mjs
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
          $BT/aapt2 dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package|sdkVersion|targetSdk"
      - uses: actions/upload-artifact@v4
        with: { name: binder-blueprint-android-test-app, path: android/app/build/outputs/apk/debug/*.apk }
      - if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk binder-blueprint-test.apk
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Android test app" --notes "The newest test build of Binder Blueprint for Android. For testing only, not the store version."
          gh release upload test-build binder-blueprint-test.apk --clobber
